            {
              "id": 44,
              "type": "text",
              "title": "How to read the RAM tier",
              "gridPos": {
                "h": 7,
                "w": 12,
                "x": 12,
                "y": 106
              },
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "options": {
                "mode": "markdown",
                "content": "**RAM tier is pre-allocated and pinned**, not demand-filled: vLLM `mmap`s the region, `MADV_POPULATE_WRITE` faults every page in, and `cudaHostRegister` pins it. So its size is fixed at `KV_OFFLOAD_GIB` per instance and **occupancy is not observable** -- there is no gauge for cached blocks. What you *can* see for RAM: allocated size, and transient transfer-pinning (`cpu_cache_usage_perc`, read/write split).\n\n**Disk tier occupancy is real** (`radiance_kvcache_bytes`) and bounded by the reaper cap (`KVCACHE_MAX_GIB`)."
              },
              "targets": []
            },
