        #!/usr/bin/env python3
        """KV-offload exporter for Prometheus: sizes the RAM (CPU-tier) and DISK (fs-tier) stores.

        RAM: vLLM pre-faults and pins the whole mmap region, so ONLY its allocated size is
        meaningful -- occupancy is not observable (there is no gauge for cached blocks; vLLM's
        kv_offload_cpu_cache_usage_perc is transient in-flight pinning, not fullness).
        DISK: the shared fs-tier dir, which vLLM does not metricise at all.
        Stdlib only, read-only."""
        import os
        import time
        from http.server import BaseHTTPRequestHandler, HTTPServer
        RAM_DIR = "/dev/shm"
        RAM_PREFIX = "vllm_offload_"
        DISK_ROOT = "/kvcache/blocks"
        MAX_BYTES = float(os.environ.get("KVCACHE_MAX_GIB") or 0) * (1024 ** 3)
        PORT = 9102


        def line(name, value, helptext, labels=None):
            labelstr = ""
            if labels:
                labelstr = "{" + ",".join('%s="%s"' % (k, v) for k, v in labels.items()) + "}"
            return "# HELP %s %s\n# TYPE %s gauge\n%s%s %s\n" % (name, helptext, name, name, labelstr, value)


        def scan_ram():
            out = []
            for name in sorted(os.listdir(RAM_DIR)):
                if not (name.startswith(RAM_PREFIX) and name.endswith(".mmap")):
                    continue
                try:
                    st = os.stat(os.path.join(RAM_DIR, name))
                except OSError:
                    continue
                engine = name[len(RAM_PREFIX):-len(".mmap")][:8]
                out.append(line("radiance_kvram_allocated_bytes", st.st_size,
                                "Allocated size of a RAM (CPU) KV tier (pre-faulted and pinned; NOT an occupancy measure).",
                                {"engine": engine}))
            return out


        def scan_disk():
            total = tmp = blocks = 0
            oldest = None
            newest = None
            now = time.time()
            for dirpath, _dirs, files in os.walk(DISK_ROOT):
                for name in files:
                    path = os.path.join(dirpath, name)
                    try:
                        st = os.stat(path)
                    except OSError:
                        continue
                    if name.endswith(".bin"):
                        total += st.st_size
                        blocks += 1
                        age = now - st.st_mtime
                        if oldest is None or age > oldest:
                            oldest = age
                        if newest is None or age < newest:
                            newest = age
                    elif ".tmp" in name:
                        tmp += st.st_size
            out = [
                line("radiance_kvcache_bytes", total, "Bytes held in the shared fs KV tier."),
                line("radiance_kvcache_tmp_bytes", tmp, "Bytes in in-progress fs-tier temp files."),
                line("radiance_kvcache_blocks", blocks, "Blocks in the shared fs KV tier."),
                line("radiance_kvcache_max_bytes", MAX_BYTES, "Reaper cap on the fs KV tier (KVCACHE_MAX_GIB)."),
            ]
            if oldest is not None:
                out.append(line("radiance_kvcache_oldest_block_age_seconds", oldest, "Age of the oldest fs-tier block."))
                out.append(line("radiance_kvcache_newest_block_age_seconds", newest, "Age of the newest fs-tier block."))
            return out


        def collect():
            return "".join(scan_ram() + scan_disk())


        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                if self.path != "/metrics":
                    self.send_response(404)
                    self.end_headers()
                    return
                data = collect().encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.send_header("Content-Length", str(len(data)))
                self.end_headers()
                self.wfile.write(data)

            def log_message(self, *args):
                pass


        if __name__ == "__main__":
            HTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
        PYEOF
        echo "observability configs written"

  # node-exporter: stock collector set + vllm shape-free (each instance scraped by
  # Prometheus directly). CPU/mem/disk/net for the host.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    networks:
      - coolify
    expose:
      - "9100"
    depends_on:
      init-observability:
        condition: service_completed_successfully
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # Shared serve-shape volume: both vllm entrypoints write a textfile metric there
      # (serve_shape_0.prom / serve_shape_1.prom) so the active offload tuning config is
      # visible to Prometheus/Grafana (radiance_serve_info{offload_policy=...}).
      - serve-shape:/textfiles:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.textfile
      - --collector.textfile.directory=/textfiles
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.cpufreq
      - --collector.loadavg
      - --collector.meminfo
      - --collector.vmstat
      - --collector.stat
      - --collector.netdev
      - --collector.netstat
      - --collector.sockstat
      - --collector.filefd
      - --collector.filesystem
      - --collector.diskstats
      - --collector.hwmon
      - --collector.rapl
      - --collector.powersupplyclass
      - --collector.systemd
      - --collector.time
      - --collector.uname
      - --collector.os

  # gpu-exporter: tiny python stdlib exporter for AMD sysfs the generic one lacks.
  # Runs as root because RAPL energy_uj is 0400 root:root.
  gpu-exporter:
    image: python:3.13-alpine
    restart: unless-stopped
    networks:
      - coolify
    expose:
      - "9101"
    depends_on:
      init-observability:
        condition: service_completed_successfully
    volumes:
      - /sys:/host/sys:ro
      - gpu-exporter-code:/code:ro
    command:
      - python3
      - /code/gpu-exporter.py

  # kvcache-exporter: sizes the shared fs (disk) KV tier on the host, which vLLM does
  # not metricise. The RAM tier is covered by the vLLM /metrics kv_offload_cpu_cache_*.
  kvcache-exporter:
    image: python:3.13-alpine
    restart: unless-stopped
    networks:
      - coolify
    expose:
      - "9102"
    depends_on:
      init-observability:
        condition: service_completed_successfully
    environment:
      - KVCACHE_MAX_GIB=${KVCACHE_MAX_GIB:-100}
    volumes:
      - ${KV_OFFLOAD_DISK_HOST_DIR:-/var/lib/radiance-kvcache}:/kvcache:ro
      - /dev/shm:/dev/shm:ro
      - kvcache-exporter-code:/code:ro
    command:
      - python3
      - /code/kvcache-exporter.py

  # Prometheus scrapes both vllm instances + node + gpu + model-router + itself.
  prometheus:
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    networks:
      - coolify
    expose:
      - "9090"
    depends_on:
      init-observability:
        condition: service_completed_successfully
    volumes:
      - prometheus-config:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-30d}
      - --web.enable-lifecycle

  # grafana: auto-provisioned datasource + the 2x dashboard above.
  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    networks:
      - coolify
    expose:
      - "3000"
    depends_on:
      init-observability:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
      node-exporter:
        condition: service_started
      gpu-exporter:
        condition: service_started
    # Grafana's admin-username env var must not be spelled as a compose
    # environment key: Coolify then treats it as a compose-managed variable and
    # refuses to let it be deleted from the service environment. So the name is
    # built at container start and mapped from GF_ADMIN_USER (default admin).
    entrypoint:
      - sh
      - -c
      - 'P=GF_SECURITY; export $${P}_ADMIN_USER="$${GF_ADMIN_USER:-admin}"; exec /run.sh'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?set GF_ADMIN_PASSWORD in the Coolify service environment}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - grafana-provisioning:/etc/grafana/provisioning:ro
      - grafana-dashboards:/etc/grafana/dashboards:ro

  # ---------------------------------------------------------------- chat UI
  # Open WebUI points at model-router (:8100), not a single instance, so it rides
  # the same least-in-flight + model-aware routing and transparent fallback.
  # Both instances share the same API key, so this is transparent to the UI.
  # DEFAULT_MODELS empty -> the UI fetches the live model list from the router,
  # which advertises EVERY registry model, so a not-yet-loaded model is
  # selectable (selecting it is what triggers the swap).
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    networks:
      - coolify
    expose:
      - "8080"
    depends_on:
      - model-router
    environment:
      - OPENAI_API_BASE_URL=http://model-router:8100/v1
      - OPENAI_API_KEY=${VLLM_API_KEY:?set VLLM_API_KEY in the Coolify service environment}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in the Coolify service environment}
      - ENABLE_SIGNUP=${WEBUI_SIGNUP:-true}
      - DEFAULT_MODELS=${DEFAULT_MODELS:-}
      - WEBUI_NAME=${WEBUI_NAME:-Radiance MXFP4}
    volumes:
      - open-webui-data:/app/backend/data

networks:
  coolify:
    external: true

volumes:
  prometheus-data:
  prometheus-config:
  grafana-data:
  grafana-provisioning:
  grafana-dashboards:
  gpu-exporter-code:
  kvcache-exporter-code:
  serve-shape:
  serve-shape-1:
  open-webui-data:
