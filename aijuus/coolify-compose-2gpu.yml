        #!/usr/bin/env python3
        """AMD GPU (per card) + CPU sensor exporter for Prometheus. Stdlib only, reads /sys.
        Reports EVERY drm card (card1, card2, ...) with a gpu label so a multi-GPU host
        shows all cards, not just the first one found."""
        import glob
        import os
        import struct
        import time
        from http.server import BaseHTTPRequestHandler, HTTPServer
        SYS = "/host/sys" if os.path.isdir("/host/sys/class/drm") else "/sys"
        PORT = 9101
        def read(path):
            try:
                with open(path) as handle:
                    return handle.read().strip()
            except OSError:
                return None
        def num(path, scale=1.0):
            value = read(path)
            if value is None:
                return None
            try:
                return float(value) / scale
            except ValueError:
                return None
        def cards():
            out = []
            for hit in sorted(glob.glob(SYS + "/class/drm/card*/device/gpu_busy_percent")):
                dev = os.path.dirname(hit)
                name = os.path.basename(os.path.dirname(dev))
                out.append((name, dev))
            return out
        def amdgpu_hwmon(dev):
            for name_path in sorted(glob.glob(dev + "/hwmon/hwmon*/name")):
                if read(name_path) == "amdgpu":
                    return os.path.dirname(name_path)
            return None
        def cpu_temp():
            best = None
            for name_path in glob.glob(SYS + "/class/hwmon/hwmon*/name"):
                if read(name_path) not in ("k10temp", "zenpower", "coretemp"):
                    continue
                for temp_path in glob.glob(os.path.dirname(name_path) + "/temp*_input"):
                    value = num(temp_path, 1000.0)
                    if value is not None and (best is None or value > best):
                        best = value
            return best
        def link_speed_gt(path):
            raw = read(path)
            if not raw:
                return None
            try:
                return float(raw.split()[0])
            except (ValueError, IndexError):
                return None
        def gpu_metrics_throttle(dev):
            """(throttle_status, indep_throttle_status) u32s from the gpu_metrics
            blob (format_rev=1, content_rev 1-3). None when the GPU is
            runtime-suspended or the read is EBUSY or the layout is unknown:
            while suspended the driver can return a stale non-zero bitmask
            (observed 2 = THERMAL at idle), which must not be surfaced."""
            if (read(dev + "/power/runtime_status") or "") == "suspended":
                return None, None
            try:
                with open(dev + "/gpu_metrics", "rb") as handle:
                    data = handle.read()
            except OSError:
                return None, None
            if len(data) < 76 or data[2] != 1 or not (1 <= data[3] <= 3):
                return None, None
            status = struct.unpack_from("<I", data, 68)[0]
            if status == 0xFFFFFFFF:
                status = None
            # indep_throttle_status is a u64 at offset 112 in content_rev 3 only;
            # offset 72 is current_fan_speed|pcie_link_width (not a throttle mask).
            indep = None
            if data[3] == 3 and len(data) >= 120:
                value = struct.unpack_from("<Q", data, 112)[0]
                if value != 0xFFFFFFFFFFFFFFFF:
                    indep = value
            return status, indep
        def ras_event_counts(dev):
            """Fatal / poison counters from ras/event_state. Reliable on RDNA4,
            unlike rocm-smi's bogus umc_err_count."""
            text = read(dev + "/ras/event_state") or ""
            out = {}
            for label in ("fatal", "poison_created", "poison_consumed"):
                out[label] = None
            for line in text.splitlines():
                line = line.strip()
                for key, label in (("Fatal Error", "fatal"),
                                   ("Poison Creation", "poison_created"),
                                   ("Poison Consumption", "poison_consumed")):
                    if not line.startswith(key):
                        continue
                    for part in line.split(","):
                        if "count:" in part:
                            try:
                                out[label] = float(part.split("count:")[1].strip())
                            except ValueError:
                                pass
            return out
        def aer_total(dev, kind):
            text = read(dev + "/aer_dev_" + kind) or ""
            for line in text.splitlines():
                fields = line.split()
                if len(fields) == 2 and fields[0].startswith("TOTAL_ERR"):
                    try:
                        return float(fields[1])
                    except ValueError:
                        return None
            return None
        _last = {}
        def zone_power(zone):
            energy = num(SYS + "/class/powercap/" + zone + "/energy_uj")
            now = time.monotonic()
            if energy is None:
                return None
            prev = _last.get(zone)
            _last[zone] = (now, energy)
            if prev is None:
                return None
            delta_t = now - prev[0]
            if delta_t <= 0:
                return None
            watts = (energy - prev[1]) / 1000000.0 / delta_t
            return watts if watts >= 0 else None
        def collect():
            lines = []
            emitted = set()
            def gauge(name, value, help_text, labels=""):
                if value is None:
                    return
                if name not in emitted:
                    emitted.add(name)
                    lines.append("# HELP " + name + " " + help_text)
                    lines.append("# TYPE " + name + " gauge")
                lines.append(name + labels + " " + repr(value))
            for name, dev in cards():
                lbl = '{gpu="' + name + '"}'
                gauge("amd_gpu_busy_percent", num(dev + "/gpu_busy_percent"), "GPU busy percent", lbl)
                gauge("amd_mem_busy_percent", num(dev + "/mem_busy_percent"), "GPU memory (UMC) busy percent", lbl)
                gauge("amd_vram_used_bytes", num(dev + "/mem_info_vram_used"), "VRAM used bytes", lbl)
                gauge("amd_vram_total_bytes", num(dev + "/mem_info_vram_total"), "VRAM total bytes", lbl)
                gtt_used = num(dev + "/mem_info_gtt_used")
                gtt_total = num(dev + "/mem_info_gtt_total")
                gauge("amd_gtt_used_bytes", gtt_used, "GPU GTT used bytes", lbl)
                gauge("amd_gtt_total_bytes", gtt_total, "GPU GTT total bytes", lbl)
                if gtt_used is not None and gtt_total:
                    gauge("amd_gtt_used_percent", gtt_used / gtt_total * 100.0, "GPU GTT used percent", lbl)
                # PCIe link health (TX/RX bandwidth counters are unsupported on RDNA4).
                gauge("amd_pcie_current_link_width", num(dev + "/current_link_width"), "PCIe current link width (lanes)", lbl)
                gauge("amd_pcie_max_link_width", num(dev + "/max_link_width"), "PCIe max link width (lanes)", lbl)
                gauge("amd_pcie_current_link_speed_gt_s", link_speed_gt(dev + "/current_link_speed"), "PCIe current link speed (GT/s)", lbl)
                gauge("amd_pcie_max_link_speed_gt_s", link_speed_gt(dev + "/max_link_speed"), "PCIe max link speed (GT/s)", lbl)
                # Throttle: raw bitmask only. The legacy AMD bit->reason map does
                # NOT hold on RDNA4 (gfx1201): both R9700s read throttle_status=2
                # at 40C/40W (not thermal), so reasons are NOT decoded here.
                # POWER_LIMIT/THERMAL are derived in Grafana from power/cap and
                # junction headroom instead.
                status, indep = gpu_metrics_throttle(dev)
                gauge("amd_gpu_throttle_status", status, "Raw throttle_status bitmask from gpu_metrics (advisory; RDNA4 semantics unresolved)", lbl)
                gauge("amd_gpu_indep_throttle_status", indep, "Raw indep_throttle_status bitmask from gpu_metrics (advisory)", lbl)
                # Fault counters from sysfs AER/RAS (reliable; rocm-smi RAS is not).
                counts = ras_event_counts(dev)
                for key, value in counts.items():
                    gauge("amd_gpu_ras_" + key + "_total", value, "RAS event_state counter", lbl)
                gauge("amd_gpu_aer_correctable_total", aer_total(dev, "correctable"), "PCIe AER correctable error total", lbl)
                gauge("amd_gpu_aer_fatal_total", aer_total(dev, "fatal"), "PCIe AER fatal error total", lbl)
                gauge("amd_gpu_aer_nonfatal_total", aer_total(dev, "nonfatal"), "PCIe AER nonfatal error total", lbl)
                # gpu_vram_bad_pages is a sysfs bin attr whose stat size is always
                # 0; the kernel emits one text line per bad page, so count lines.
                bad_pages_text = read(dev + "/ras/gpu_vram_bad_pages")
                bad_pages = None
                if bad_pages_text is not None:
                    bad_pages = float(sum(1 for line in bad_pages_text.splitlines() if line.strip()))
                gauge("amd_gpu_vram_bad_pages", bad_pages, "VRAM bad pages reported", lbl)
                hw = amdgpu_hwmon(dev)
                if hw:
                    gauge("amd_gpu_temp_edge_celsius", num(hw + "/temp1_input", 1000.0), "GPU edge temperature", lbl)
                    gauge("amd_gpu_temp_junction_celsius", num(hw + "/temp2_input", 1000.0), "GPU junction temperature", lbl)
                    gauge("amd_gpu_temp_mem_celsius", num(hw + "/temp3_input", 1000.0), "GPU memory temperature", lbl)
                    gauge("amd_gpu_temp_junction_crit_celsius", num(hw + "/temp2_crit", 1000.0), "GPU junction temperature crit threshold", lbl)
                    gauge("amd_gpu_sclk_hz", num(hw + "/freq1_input"), "GPU shader clock", lbl)
                    gauge("amd_gpu_mclk_hz", num(hw + "/freq2_input"), "GPU memory clock", lbl)
                    gauge("amd_gpu_fan_rpm", num(hw + "/fan1_input"), "GPU fan speed", lbl)
                    fan_pwm = num(hw + "/pwm1")
                    if fan_pwm is not None:
                        gauge("amd_gpu_fan_percent", fan_pwm / 255.0 * 100.0, "GPU fan speed percent (pwm1)", lbl)
                    gauge("amd_gpu_voltage_mv", num(hw + "/in0_input"), "GPU voltage (mV)", lbl)
                    gauge("amd_gpu_power_watts", num(hw + "/power1_average", 1000000.0), "GPU package power", lbl)
                    gauge("amd_gpu_power_cap_watts", num(hw + "/power1_cap", 1000000.0), "GPU power cap", lbl)
            gauge("amd_cpu_temp_celsius", cpu_temp(), "CPU temperature hottest sensor")
            try:
                zones = sorted(os.listdir(SYS + "/class/powercap"))
            except OSError:
                zones = []
            for zone in zones:
                if ":" not in zone:
                    continue
                watts = zone_power(zone)
                if watts is None:
                    continue
                zone_name = read(SYS + "/class/powercap/" + zone + "/name") or zone
                gauge("amd_cpu_power_watts", watts, "CPU RAPL zone power", '{zone="' + zone_name + '"}')
            return "\n".join(lines) + "\n"
        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                if self.path != "/metrics":
                    self.send_response(404)
                    self.end_headers()
                    return
                data = collect().encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.send_header("Content-Length", str(len(data)))
                self.end_headers()
                self.wfile.write(data)
            def log_message(self, *args):
                pass
        if __name__ == "__main__":
            HTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
