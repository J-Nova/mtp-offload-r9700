# Coolify deployment for MXFP4 (path A) -- TWO GPUs, data-parallel. One MXFP4-OCP-GPTQ
# instance per card (each TP=1, no tensor parallelism), load-balanced by
# model-router (a Python OpenAI front door; see MODEL HOT-SWAP below).
# DEFAULT (2026-09-28): Qwen3.8-3.6-27B-blend-MXFP4-OCP-GPTQ-mtp -- MTP SPEC=8 via the head
# inside the blend (no drafter), verify_head=0. Every other registry model (ThinkingCap dflash/16,
# base MXFP4 dflash/16, blend dflash/16) loads on request. The 160000 KV pin (8761733283,
# seqs=8/chunk=4096/dflash:16) is calibrated for the dflash entries; the blend-MTP entry has no
# mtp:8 pin yet, so it profiles KV. DECODE_MAX_M/capture ladder sized for SEQS*(SPEC+1)=136.
#
# Generated from `coolify-compose.yml` (the 1x R9700 / TP=1 profile) on 2026-09-22.
# It is that file with the single `vllm` service fanned out into `vllm-0` (GPU 0) and
# `vllm-1` (GPU 1) + a load balancer in front, the observability scrape list updated
# for two backends, and Open WebUI pointed at the LB.
#
# MODEL HOT-SWAP (2026-09-28): model-registry.json (repo root) maps each servable model to
# its path / drafter / spec / calibrated KV pin. model-router (:8100) owns the OpenAI API:
# it parses the request's `model`, load-balances across the instances that serve it, and for
# a registered-but-unloaded model writes a swap trigger and -- if another model is ready --
# answers with that model meanwhile, so the user sees no error. model-controller then swaps
# ONE instance (state.json -> docker restart -> health poll -> ready), leaving the other
# untouched so the previously-loaded model keeps serving throughout -- no error window.
# Add a model by adding a key to model-registry.json (kv_cache_memory MUST be calibrated
# per model via ./calibrate-kv.sh).
#
# WHY TWO INSTANCES AND NOT TENSOR=2 (the x1-lane reason):
#   The second card sits on a PCIe x1 lane. Tensor-parallel runs an all-reduce across BOTH
#   cards every layer -- over an x1 link (~1 GB/s) that would throttle the whole run.
#   Two independent TP=1 instances do ZERO inter-GPU communication in the inference hot path
#   (each model is fully VRAM-resident on its own card). x1 only slows that card's one-time
#   weight load (cached after the first start); steady-state throughput is not affected.
#
# Deploy (paste this whole file into Coolify as a Docker Compose resource on THIS host,
# the one with /dev/kfd + /home/juup/models):
#   1. docker stop vllmmxfp4074   (frees the GPU(s) the old single instance held)
#   2. Deploy in Coolify.
#   Domains (set in the Coolify UI):
#     model-router      -> port 8100   (the public endpoint; Open WebUI + clients point here)
#     vllm-0 / vllm-1   -> 8000 / 8001 (OPTIONAL, for direct per-instance access + debugging)
#     open-webui        -> 8080, grafana -> 3000, prometheus -> 9090 (or keep internal-only)
# Do NOT publish host ports here; Traefik on the `coolify` net handles exposure.
#
# Notes (carried over from the single-GPU file -- still true here):
# - --network=host is dropped. Each serve binds --host 0.0.0.0, so bridge networking works and
#   Traefik on the `coolify` net reaches each instance.
# - $$ in the vllm entrypoint prelude is NOT a typo: compose interpolates $VARS, so every $
#   in that prelude is doubled to survive to the container (e.g. $$SP -> $SP inside). Every
#   OTHER service in this file uses single $. Do not "fix" those.
# - First start compiles for minutes (cold cache). The healthcheck start_period must stay at
#   1800s or Coolify will kill a healthy-but-compiling server. Both vllm instances compile, so
#   a first deploy can show both as busy for a while -- that is expected.
# - The two vllm instances share /models (read), /r4d (read), /patches (read) and the HF cache
#   (read). They have SEPARATE /cache dirs (writable) so the two concurrent cold compiles do
#   not race on the same Triton/inductor output (the one real foot-gun of two instances).
# - The per-instance kernel .so is compiled into each container's OWN site-packages (not the
#   shared /cache), so that part is naturally isolated already.
# - model-router fronts the two instances with least-in-flight balancing (a long generation
#   holds a connection, so a busy instance gets fewer new requests -- load-aware, not blind
#   round-robin; ties rotate) and routes by the request's `model` via state.json. A dead
#   card's instance goes not-ready in state.json, so traffic flows to the survivor: degraded,
#   not down. One GPU failing is NOT a full outage -- the other keeps serving.
# - Health comes from model-controller's /health polls into state.json, not from the router
#   itself, so the router always has a current ready/not-ready view with no probes of its own.
# - Cache-aware routing (send a shared system prompt to the instance that already has it
#   cached) is the ceiling over least-inflight; it only pays off if traffic is dominated by
#   one shared prompt. For a chat UI, least-inflight is the 90%.

services:
  vllm-0:
    image: stilldeadcode/vllm-radiance:0.9.3
    restart: unless-stopped
    privileged: true
    ipc: host
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "993"
      - "44"
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_PTRACE
    # Hard HOST RAM cap (VLLM_MEM_LIMIT). VRAM is NOT bounded by this: GPU device memory
    # is a different cgroup resource, so --gpu-memory-utilization 0.98 still uses all of
    # VRAM. Sized for the default 12 GiB pinned CPU KV tier plus runtime/load headroom
    # (lower KV_OFFLOAD_GIB if you shrink this). Memswap == mem so a runaway cannot refill
    # host swap (which was 100% full at both 2026-09-23 freezes); it is cgroup-OOM-killed
    # instead. Production runs 24g; the repo .env carries a stale single-instance 20g.
    mem_limit: ${VLLM_MEM_LIMIT:-24g}
    memswap_limit: ${VLLM_MEM_LIMIT:-24g}
    networks:
      - coolify
    expose:
      - "8000"
    environment:
      - VLLM_API_KEY=${VLLM_API_KEY:?set VLLM_API_KEY in the Coolify service environment}
      # Deterministic block-hash seed. vLLM seeds its prefix-cache hash chain with a
      # RANDOM value (os.urandom(32)) when PYTHONHASHSEED is unset
      # (v1/core/kv_cache_utils.py: NONE_HASH in init_none_hash), and EVERY block hash
      # descends from that seed (hash_block_tokens: parent_block_hash = NONE_HASH).
      # So without this, identical prompts get different block hashes per process, and
      # the SHARED fs tier cannot dedup or read the other instance's blocks (and loses
      # reuse across a restart). Fixing the seed makes filenames content-deterministic
      # so both replicas share one key space -- the premise the fs tier documents.
      # MUST be the SAME value on both instances. P2P would refuse to start without it.
      - PYTHONHASHSEED=0
      - ROCR_VISIBLE_DEVICES=0
      - HIP_VISIBLE_DEVICES=0
      # Instance index for the shape-label metric (radiance_serve_info{instance=...}) and
      # for the per-instance serve_shape_<rank>.prom file. Keep 0 here, 1 on vllm-1.
      - SERVE_RANK=0
      # Model to boot when /model-state/state.json has no entry for this instance yet
      # (fresh boot). Hot-swap restarts read state.json instead; see model-registry.json.
      - MODEL_DEFAULT=${MODEL_DEFAULT:-Qwen3.8-3.6-27B-blend-MXFP4-OCP-GPTQ-mtp}
      # Model identity, drafter, spec depth and KV pin are intentionally NOT set
      # here: the entrypoint resolves them per model from model-registry.json
      # (keyed by this instance's model in state.json). A value set here would be
      # silently overwritten by that eval -- see the model-selection block below.
      # CPU KV-offload tier, GiB (0 = off). Default 12 per PERFORMANCE.md for the prod
      # 2-instance shape: both share the host /dev/shm (ipc: host, 32 G) so the two tiers must
      # SUM to <= ~28 G (both default 12 -> 24 G). The head cap is "auto" (a fair share per
      # concurrent request) so an over-subscribed cycle restores a partial prefix instead of
      # nothing. See PERFORMANCE.md "Productionizing the CPU/disk KV offload".
      - KV_OFFLOAD_GIB=${KV_OFFLOAD_GIB:-12}
      # --- Offload tuning knobs (set per redeploy to A/B in Grafana) ---
      # Primary (CPU/RAM) tier eviction policy: "lru" (default) or "arc". ARC
      # (Adaptive Replacement Cache) balances recency + frequency, which can lift the
      # RAM hit rate on repeated-prefix traffic (RAM hit ~1 s vs disk ~8.6 s). Compare
      # runs with the Grafana row "Offload tuning A/B (eviction / async / fan-out)".
      - KV_OFFLOAD_EVICTION_POLICY=${KV_OFFLOAD_EVICTION_POLICY:-lru}
      # fs secondary-tier I/O pool sizes. Reads are what restore latency waits on; the
      # fs fan-out patch also splits one restore across up to READ threads.
      - KV_OFFLOAD_READ_THREADS=${KV_OFFLOAD_READ_THREADS:-32}
      - KV_OFFLOAD_WRITE_THREADS=${KV_OFFLOAD_WRITE_THREADS:-16}
      # fs fan-out budget (patch_offload_fs_tier.py): MAX = flat batch cap (0 = derive
      # from TARGET_MB / block bytes). Raising it parallelises a single restore. The
      # measured SATA ceiling is ~480 MB/s, so fan-out (not the thread count) is what
      # closes the gap between the ~270 MB/s seen today and the device limit.
      - RADIANCE_FS_FANOUT_TARGET_MB=${RADIANCE_FS_FANOUT_TARGET_MB:-512}
      - RADIANCE_FS_FANOUT_MAX=${RADIANCE_FS_FANOUT_MAX:-32}
      # Async scheduler: 0 = keep --no-async-scheduling (current, conservative);
      # 1 = --async-scheduling (overlap CPU scheduling with GPU work). Test for
      # regressions against the custom R4D/Mamba backends before trusting it.
      - VLLM_ASYNC_SCHEDULING=${VLLM_ASYNC_SCHEDULING:-0}
      # On this stack async refuses KV offload (unvalidated). 1 forces the combination
      # for a test; expect offload-cache corruption if it is genuinely unsafe.
      - RADIANCE_ASYNC_ALLOW_OFFLOAD=${RADIANCE_ASYNC_ALLOW_OFFLOAD:-0}
      # Head-cap override: empty = auto by topology (Mode A "auto", Mode B off). See the KV block.
      - KV_OFFLOAD_HEAD_CAP=${KV_OFFLOAD_HEAD_CAP:-}
      - MAX_NUM_SEQS=${MAX_NUM_SEQS:-8}
      - MAX_NUM_BATCHED_TOKENS=${MAX_NUM_BATCHED_TOKENS:-4096}
      - RADIANCE_OFFLOAD_EAGLE_FIX=${RADIANCE_OFFLOAD_EAGLE_FIX:-1}
      - RADIANCE_OFFLOAD_EAGLE_GROUPS=${RADIANCE_OFFLOAD_EAGLE_GROUPS:-1}
      - RADIANCE_OFFLOAD_DEBUG=${RADIANCE_OFFLOAD_DEBUG:-0}
      - RADIANCE_OFFLOAD_TRACE=${RADIANCE_OFFLOAD_TRACE:-0}
      # Optional fs-tier host bind; set KV_OFFLOAD_DISK_HOST_DIR to put the shared disk store elsewhere.
      # Optional SHARED fs secondary tier: both instances point at the same directory, so a
      # prefix cached by one is loadable by the other (and it survives restarts). This is a
      # path INSIDE the container -- mount a host dir (fast SSD/NVMe) there on BOTH services,
      # and run the reaper (ops/kvcache-reap.sh) against it. Defaults to /kvcache/blocks (the
      # shared bind above); set it to empty for CPU-only (Mode A).
      # Enabling it also turns on the failed-load fix, without which a reaped block hangs a
      # request (patch_offload_fs_tier.py).
      - KV_OFFLOAD_DISK_DIR=${KV_OFFLOAD_DISK_DIR-/kvcache/blocks}
      - HF_HUB_OFFLINE=1
      - VLLM_LOGGING_LEVEL=${VLLM_LOGGING_LEVEL:-INFO}
      - VLLM_NO_USAGE_STATS=1
      - VLLM_ROCM_USE_AITER=1
      - VLLM_ROCM_USE_AITER_UNIFIED_ATTENTION=1
      - VLLM_ROCM_USE_AITER_MHA=0
      - VLLM_ROCM_USE_AITER_MLA=0
      - VLLM_ROCM_USE_AITER_MOE=0
      - VLLM_ROCM_USE_AITER_LINEAR=0
      - VLLM_ROCM_USE_AITER_FP8BMM=0
      - VLLM_ROCM_USE_AITER_FP4BMM=0
      - VLLM_ROCM_USE_AITER_RMSNORM=0
      - NCCL_PROTO=Simple
      - RADIANCE_USE_R4D=1
      - RADIANCE_USE_R4D_AR=1
      - RADIANCE_USE_R4D_AR_QUANT=1
      - RADIANCE_R4D_REPORT=1
      - RADIANCE_AR_QBITS=6
      - RADIANCE_TP_PAD=0
      - RADIANCE_TP_PAD_DRAFTER=0
      - RADIANCE_TP_PAD_STRICT=0
      - RADIANCE_GDN_MERGE_INPROJ=1
      - RADIANCE_FP8_STREAM_TP1=1
      - RADIANCE_GDN_NORM_QUANT=1
      - RADIANCE_GDN_STRIDED_GATES=0
      - RADIANCE_GDN_EMPTY_OUT=0
      - R4D_ATTN_FP8=3
      - RADIANCE_AR_OVERLAP=0
      - RADIANCE_GDN_FUSED_UPDATE=1
      - RADIANCE_GDN_FUSED_MAX_ITEMS=48
      - RADIANCE_GDN_TRACE_SIDX=0
      - RADIANCE_GDN_LAZY=0
      - RADIANCE_AR_QNB=96
      - RADIANCE_AR_QNT=1024
      - MXFP4_CUMODE=0
      - RADIANCE_STEP_TRACE=0
      - RADIANCE_AR_OVERLAP_MIN_M=2048
      - RADIANCE_AR_OVERLAP_SLICES=4
      - RADIANCE_TOPK_TRITON_MIN_ROWS=8
      - RADIANCE_SKINNY_GEMM=1
      - RADIANCE_DFLASH_CALIB_TOKENS=200000
      - RADIANCE_FP8_STREAM=1
      - RADIANCE_RMS_QUANT_FUSION=1
      - RADIANCE_NVFP4_MXFP4=0
      - RADIANCE_NVFP4_EXP=mse
      - RADIANCE_NVFP4_FP8_LAYERS=mxfp4
      - RADIANCE_NVFP4_BF16_LAYERS=in_proj_ba
      - RADIANCE_NVFP4_LMHEAD=bf16
      - RADIANCE_GDN_PATHS=both
      - RADIANCE_GDN_NANTRACE=0
      - VLLM_CACHE_ROOT=/cache/vllm
      - TORCHINDUCTOR_CACHE_DIR=/cache/inductor
      - TRITON_CACHE_DIR=/cache/triton
      - AITER_ROOT_DIR=/cache/aiter
      - TRITON_CACHE_AUTOTUNING=1
      - R4D_SO=/home/juup/.cache/radiance-libr4d/b9e42ab-rx9
    volumes:
      - /home/juup/models:/models
      - /home/juup/.radiance-cache-w4a8-093-gdnm-nqft-fp8s-gnq-tp1s:/cache
      - /home/juup/radiance-vllm-mxfp4:/patches:z
      - /home/juup/.cache/radiance-libr4d/b9e42ab-rx9:/r4d:z
      # Shared fs KV tier backing store, mounted into BOTH instances. Point the host side at a
      # dedicated SSD/volume (or a loop volume from ops/make-kvcache-volume.sh). Docker creates
      # the default path if absent. The host-side reaper runs against the same directory.
      - ${KV_OFFLOAD_DISK_HOST_DIR:-/var/lib/radiance-kvcache}:/kvcache
      - /home/juup/.cache/huggingface:/root/.cache/huggingface
      # Shared model-swap state (READ-ONLY here): the entrypoint picks its model from
      # state.json at boot; model-controller is the sole writer. See model-registry.json.
      - ${MODEL_STATE_HOST_DIR:-/var/lib/radiance-model-state}:/model-state:ro
      - serve-shape:/tmp/serve-shape
    entrypoint:
      - bash
      - -lc
      - |
        set -e
        # ---- model selection (hot-swap; see model-registry.json) ----
        # The registry (repo root -> /patches) maps each servable model to its
        # path / drafter / spec / calibrated KV pin. The desired model comes from
        # /model-state/state.json (written by model-controller) so a swap restart
        # boots the NEW model; a fresh boot falls back to MODEL_DEFAULT, then the
        # first registry entry. Everything below (KV pin, capture ladder, spec cfg)
        # then resolves from these values unchanged.
        RID=$${SERVE_RANK:-0}
        INST="vllm-$$RID"
        [ -f /patches/aijuus/model-registry.json ] || { echo "[run] FATAL: /patches/aijuus/model-registry.json missing (repo bind not mounted?)" >&2; exit 1; }
        eval "$$(python3 - "$$INST" <<'PY'
        import json, os, sys
        inst = sys.argv[1]
        full = json.load(open("/patches/aijuus/model-registry.json"))
        reg = {k: v for k, v in full.items() if not k.startswith("_")}
        dflt = full.get("_defaults", {})
        name = os.environ.get("MODEL_DEFAULT")
        try:
            st = json.load(open("/model-state/state.json"))
            e = st.get(inst)
            if e and e.get("model") in reg:
                name = e["model"]
        except Exception:
            pass
        if not name or name not in reg:
            name = sorted(reg)[0]
        e = reg[name]
        def q(s):
            return "'" + str(s).replace("'", "'\\''") + "'"
        def pick(field, default=None):
            return e.get(field, dflt.get(field, default))
        print("MODEL_NAME=" + q(name))
        print("VLLM_MODEL_PATH=" + q(e["path"]))
        print("VLLM_SERVED_MODEL_NAME=" + q(e.get("served_name", name)))
        print("SPEC_DRAFTER=" + q(e.get("drafter", "")))
        print("SPEC_METHOD=" + q(e.get("spec_method", "none")))
        print("SPEC_TOKENS=" + q(e.get("spec_tokens", "")))
        print("KV_CACHE_MEMORY=" + q(e.get("kv_cache_memory", "")))
        print("VERIFY_HEAD=" + q(e.get("verify_head", "")))
        print("MAX_MODEL_LEN=" + q(pick("max_model_len", "")))
        print("KV_CACHE_DTYPE=" + q(pick("kv_cache_dtype", "fp8")))
        print("CHAT_TEMPLATE=" + q(pick("chat_template", "")))
        print("TOOL_CALL_PARSER=" + q(pick("tool_call_parser", "")))
        print("REASONING_PARSER=" + q(pick("reasoning_parser", "")))
        gc = pick("generation_config", None)
        print("GEN_CFG=" + q(json.dumps(gc) if gc else "{}"))
        env = dict(dflt.get("server_env", {}))
        env.update(e.get("server_env", {}))
        for k in sorted(env):
            print("export " + k + "=" + q(env[k]))
        PY
        )"
        echo "[run] model selected: $$MODEL_NAME path=$$VLLM_MODEL_PATH spec=$$SPEC_METHOD/$$SPEC_TOKENS kv=$$KV_CACHE_MEMORY vhead=$${VERIFY_HEAD:-auto}"
        # ---- parametrized serving shape (env vars, defaults = measured TP=1) ----
        # NOTE: the vllm entrypoint uses DOUBLE dollars ($$) throughout so
        # Compose passes them to the container; every other service in this
        # file uses single $. Do not "fix" these to single $ -- Coolify would
        # interpolate them at deploy time and the prelude would resolve empty.
        SEQS=$${MAX_NUM_SEQS:-8}
        MLEN=$${MAX_MODEL_LEN:-160000}
        CHUNK=$${MAX_NUM_BATCHED_TOKENS:-4096}
        SMETHOD=$${SPEC_METHOD:-dflash}
        case "$$SMETHOD" in dflash|mtp|none) ;; *) echo "SPEC_METHOD must be dflash, mtp or none, got: $$SMETHOD" >&2; exit 1 ;; esac
        # VERIFY_HEAD is a PER-MODEL setting from model-registry.json (`verify_head`):
        # the int2 verify-head GEMM is +2.9% decode under dflash and neutral under mtp.
        # If a model entry omits it, fall back to the method default.
        if [ -z "$${VERIFY_HEAD:-}" ]; then
          if [ "$$SMETHOD" = dflash ]; then VERIFY_HEAD=1; else VERIFY_HEAD=0; fi
        fi
        export RADIANCE_VERIFY_HEAD="$$VERIFY_HEAD"
        if [ "$$SMETHOD" = none ]; then
          SPEC=0
        elif [ -z "$${SPEC_TOKENS:-}" ]; then
          if [ "$$SMETHOD" = dflash ]; then SPEC=16; else SPEC=4; fi
        else
          SPEC="$$SPEC_TOKENS"
        fi
        # KV sizing. The calibrated pin comes from model-registry.json
        # (kv_cache_memory, emitted by the model-selection eval above). It is
        # REQUIRED whenever maxlen is 160000, where vLLM's own profiling finds
        # only ~4.81 GiB, below the ~5.71 GiB a single 160k request needs.
        # A registry entry with no kv_cache_memory (or 0) forces profiling.
        if [ -n "$${KV_CACHE_MEMORY:-auto}" ] && [ "$${KV_CACHE_MEMORY:-auto}" != auto ] && [ "$${KV_CACHE_MEMORY:-auto}" != 0 ]; then
          KMEM="$$KV_CACHE_MEMORY"
          KV_SRC=explicit
        else
          KV_SRC=profiled
          KMEM=""
        fi
        # Prefill all-reduce gate from the chunk (CHUNK*5120*2/1024+4096) so a
        # non-default chunk cannot silently drop prefill onto RCCL.
        # Offload tuning knobs, resolved once. Used by both the transfer-config JSON
        # and the shape-label metric the Grafana "Offload tuning A/B" row reads, so a
        # policy/thread/async change shows up as a label flip on the next redeploy.
        OPOLICY=$${KV_OFFLOAD_EVICTION_POLICY:-lru}
        ASCHED=$${VLLM_ASYNC_SCHEDULING:-0}
        RTHREADS=$${KV_OFFLOAD_READ_THREADS:-32}
        WTHREADS=$${KV_OFFLOAD_WRITE_THREADS:-16}
        FANOUT=$${RADIANCE_FS_FANOUT_MAX:-32}
        RID=$${SERVE_RANK:-0}
        OVMODE=off
        if [ -n "$$KV_OFFLOAD_GIB" ] && [ "$$KV_OFFLOAD_GIB" != 0 ]; then OVMODE=on; fi
        MAMBA_MODE=$${MAMBA_CACHE_MODE:-align}
        # ---- Async-scheduling preflight (see PERFORMANCE.md "Async scheduling") -----------------
        # vLLM HARD-gates --async-scheduling (config/vllm.py:1081+): the spec method must be an
        # EAGLE-family type (mtp/dflash qualify), the executor must support it (uniproc/mp do),
        # and disable_padded_drafter_batch must be FALSE -- so async and the UNPADDED drafter are
        # ONE switch. Derive UNPAD from ASCHED (mirrors serve-mxfp4.sh) so the flag cannot boot
        # into vLLM's hard error. We also refuse the combinations this patched stack has NOT
        # validated, so flipping the flag can never silently corrupt hybrid/spec/offload state.
        if [ "$$ASCHED" = 1 ]; then
          UNPAD=false
          # Hybrid/Mamba spec-decode + async only syncs num_accepted_tokens in align mode
          # (gpu_model_runner.py skips the CPU sync for async non-align). We only run align.
          if [ "$$MAMBA_MODE" != align ]; then
            echo "[run] FATAL: VLLM_ASYNC_SCHEDULING=1 requires mamba cache mode align" >&2
            exit 1
          fi
          # async + KV offload is unvalidated here (the offload/eagle patches assume sync
          # scheduler semantics). Refuse unless explicitly forced for a test.
          if [ "$$OVMODE" = on ] && [ "$${RADIANCE_ASYNC_ALLOW_OFFLOAD:-0}" != 1 ]; then
            echo "[run] FATAL: async scheduling + KV offload is unvalidated (offload patches assume sync)." >&2
            echo "      Unset KV_OFFLOAD_GIB, or set RADIANCE_ASYNC_ALLOW_OFFLOAD=1 to force a test." >&2
            exit 1
          fi
          echo "[run] async scheduling ENABLED (padded drafter; async_allow_offload=$${RADIANCE_ASYNC_ALLOW_OFFLOAD:-0})"
        else
          UNPAD=true
        fi
        AR_MAX_KB=$$(( $$CHUNK * 5120 * 2 / 1024 + 4096 ))
        # Cudagraph capture ceiling = SEQS*(SPEC+1), stock ladder trimmed to it
        # (mirrors serve-mxfp4.sh: SEQS=8 SPEC=16 -> 136, so the ladder runs to 256).
        CAP=$$(( $$SEQS * ($$SPEC + 1) ))
        SIZES=""
        for s in 1 2 4 8 16 24 32 40 48 56 64 72 80 88 96 104 112 120 128 \
                  136 144 152 160 168 176 184 192 200 208 216 224 232 240 248 256; do
          [ "$$s" -le "$$CAP" ] && SIZES="$${SIZES:+$$SIZES,}$$s"
        done
        CAPLIST="[$$SIZES]"
        # Speculative config. mtp needs no drafter checkpoint; dflash does; none disables it.
        if [ "$$SMETHOD" = none ]; then
          SPEC_CFG=""
        elif [ "$$SMETHOD" = mtp ]; then
          SPEC_CFG="{\"method\":\"mtp\",\"num_speculative_tokens\":$$SPEC,\"attention_backend\":\"R4D\",\"disable_padded_drafter_batch\":$$UNPAD}"
        else
          SPEC_CFG="{\"method\":\"dflash\",\"model\":\"$$SPEC_DRAFTER\",\"num_speculative_tokens\":$$SPEC,\"attention_backend\":\"TRITON_ATTN\",\"disable_padded_drafter_batch\":$$UNPAD,\"draft_sample_method\":\"greedy\"}"
        fi
        # Expose the resolved shape for logs + Prometheus labels.
        export RADIANCE_AR_MAX_KB="$$AR_MAX_KB"
        export SERVE_KV_SOURCE="$$KV_SRC"
        export SERVE_SPEC_RESOLVED="$$SPEC"
        echo "[run] TP=1 shape: seqs=$$SEQS maxlen=$$MLEN chunk=$$CHUNK kv=$${KMEM:-none}($$KV_SRC) spec=$$SMETHOD/$$SPEC ar_max_kb=$$AR_MAX_KB captures=$$CAPLIST"
        SP=/opt/vllm/lib/python3.12/site-packages
        cd /patches
        python3 patch_quark_mxfp4.py
        python3 patch_nvfp4_mxfp4.py
        python3 patch_tp3_pad.py
        python3 patch_ar_maxbytes.py
        python3 patch_topk_triton_rows.py
        python3 patch_dflash_calib.py
        python3 patch_dflash_mxfp4_kv.py
        python3 patch_rmsquant_fusion.py
        python3 patch_verify_head.py
        python3 patch_kv_group_size.py
        python3 patch_topk_composite.py
        python3 patch_gdn_shared_build.py
        python3 patch_dflash_selector_topk.py
        python3 patch_gdn_merge_inproj.py
        python3 patch_dynwidth.py
        python3 patch_async_dynwidth.py
        python3 patch_step_trace.py
        python3 patch_ar_geometry.py
        python3 patch_ar_qbits.py
        python3 patch_ar_3rank.py
        python3 patch_gdn_glue.py
        if [ "$${RADIANCE_GDN_LAZY:-0}" = 1 ]; then python3 patch_gdn_lazy.py; fi
        python3 patch_qwen3_thinkoff.py || echo "[radiance] WARNING: thinkoff patch did not apply; thinking-off requests will return empty content"
        # ---- KV offload patches (mirror serve-mxfp4.sh). All inert unless KV_OFFLOAD_GIB
        # turns the OffloadingConnector on; they are what make the CPU/fs tiers correct.
        if [ "$${RADIANCE_OFFLOAD_DEBUG:-0}" = 1 ]; then python3 aijuus/patch_offload_debug.py; fi   # diagnostic only
        if [ "$${RADIANCE_OFFLOAD_EAGLE_FIX:-1}" != 0 ]; then python3 aijuus/patch_offload_eagle_fallback.py; fi   # hybrid (Mamba/SWA) correctness
        if [ "$${RADIANCE_OFFLOAD_EAGLE_GROUPS:-1}" != 0 ]; then python3 aijuus/patch_offload_eagle_groups.py; fi   # per-group restore (~2x faster); 0 = coarse fallback
        python3 aijuus/patch_mamba_stride.py \
          || echo "[radiance] WARNING: mamba store-cadence patch did NOT apply -- every chunk stores all six Mamba groups"
        python3 aijuus/patch_offload_swa_touch.py \
          || echo "[radiance] WARNING: swa-align/touch-order patch did NOT apply -- heads still age out"
        python3 aijuus/patch_offload_fs_tier.py \
          || echo "[radiance] WARNING: fs-tier patch did NOT apply -- do NOT enable the fs disk tier"
        python3 aijuus/patch_offload_head_cap.py   # head-only CPU retention; inert unless max_offload_tokens/RADIANCE_OFFLOAD_MAX_TOKENS is set
        if [ "$${RADIANCE_OFFLOAD_TRACE:-0}" = 1 ]; then python3 aijuus/patch_offload_trace.py; fi   # deep diagnostic
        cp mxfp4-configs/*.json "$$SP"/aiter/ops/triton/configs/gemm/
        cp radiance_preamble.py /opt/radiance_preamble.py
        cp radiance_nvfp4.py radiance_mxfp4.py radiance_gdn.py radiance_gdn_lazy.py radiance_rmsquant.py radiance_drafthead.py radiance_verifyhead.py radiance_gdnmerge.py radiance_aroverlap.py radiance_topk.py radiance_arnq.py radiance_tp3pad.py "$$SP"/
        hipcc -O3 -w -std=c++17 -fPIC -shared --offload-arch=gfx1201 $$([ "$${MXFP4_CUMODE:-0}" = 1 ] && echo -mcumode) $$(python3 -m pybind11 --includes) radiance_mxfp4_fp8.hip -o "$$SP"/radiance_mxfp4_fp8.so
        if [ -n "$${R4D_SO:-}" ] && [ -f /r4d/r4d.so ]; then
          cp /r4d/r4d.so "$$SP"/r4d.so
          echo "[radiance] using patched r4d.so from $$R4D_SO"
        fi
        # Shape labels for Prometheus (node-exporter --collector.textfile
        # scrapes the shared serve-shape volume).
        rm -f /tmp/serve-shape/serve_shape.prom
        printf 'radiance_serve_info{instance="%s",max_num_seqs="%s",max_model_len="%s",max_num_batched_tokens="%s",kv_source="%s",spec_method="%s",spec_tokens="%s",offload_policy="%s",offload_mode="%s",async_sched="%s",read_threads="%s",write_threads="%s",fanout_max="%s"} 1\n' \
          "$$RID" "$$SEQS" "$$MLEN" "$$CHUNK" "$$KV_SRC" "$$SMETHOD" "$$SPEC" "$$OPOLICY" "$$OVMODE" "$$ASCHED" "$$RTHREADS" "$$WTHREADS" "$$FANOUT" > /tmp/serve-shape/serve_shape_$$RID.prom
        echo "[run] shape labels: kv=$$KV_SRC spec=$$SMETHOD/$$SPEC"
        # ---- stale CPU-KV-offload region sweep (THIS instance only) ----
        # vLLM names its CPU offload tier /dev/shm/vllm_offload_<engine_id>.mmap
        # and only unlinks it in cleanup(), so a crashed/killed start leaks one
        # (it used a fresh uuid each boot). Enough leaks fill the 32G host tmpfs
        # and the next start then dies in MADV_POPULATE_WRITE with EFAULT
        # (Errno 14) -- the 2026-09-28 outage. engine_id is pinned per instance
        # below (radrank$$SERVE_RANK), so our own stale region has a known name and is
        # removed here BEFORE the engine re-creates it. Only our own name is
        # matched: ipc: host shares /dev/shm with the peer instance, whose live
        # region must never be touched.
        # Hardening: engine_id names the shared /dev/shm region, so it MUST
        # be distinct per instance. Fail fast if SERVE_RANK is unset/empty --
        # a blank rank would alias the peer (both use 0) and make each
        # instance sweep the other's live region. A uuid is un-sweepable and
        # a hostname changes on container recreate (would orphan the sweep),
        # so the stable, unique per-instance rank is the right token.
        : "$${SERVE_RANK:?SERVE_RANK must be set to a distinct value per instance (0/1)}"
        ENG_ID="radrank$$SERVE_RANK"
        for _f in /dev/shm/vllm_offload_$${ENG_ID}*.mmap; do
          [ -e "$${_f}" ] || continue
          echo "[run] sweeping stale KV-offload region $$_f"
          rm -f "$${_f}"
        done
        cd /
        # Final argv assembled here from the resolved shape (no static command:
        # compose cannot do arithmetic or conditionals, the entrypoint can).
        KV_ARG=""
        [ -n "$$KMEM" ] && KV_ARG="--kv-cache-memory $$KMEM"
        # KV offload (env-gated, default off). --kv-offloading-size sets cpu_bytes_to_use AND
        # selects OffloadingConnector; the JSON only adds extra_config.
        # Head cap (patch_offload_head_cap.py) is what distinguishes the two modes:
        #   Mode A (CPU only, no KV_OFFLOAD_DISK_DIR): max_offload_tokens="auto" -- fit the CPU
        #     tier exactly, so over-subscription restores a contiguous partial prefix, never nothing.
        #   Mode B (CPU + shared fs, KV_OFFLOAD_DISK_DIR set): NO cap -- the disk holds the
        #     overflow, and a per-request cap would defeat it. Reaper REQUIRED.
        # KV_OFFLOAD_HEAD_CAP overrides the topology default: "auto" | <N> | "off".
        # No spaces in the JSON, so word-splitting the unquoted OFF_ARG is safe.
        OFF_ARG=""
        if [ -n "$$KV_OFFLOAD_GIB" ] && [ "$$KV_OFFLOAD_GIB" != 0 ]; then
          HC="$${KV_OFFLOAD_HEAD_CAP:-}"
          if [ -z "$$HC" ]; then
            if [ -n "$$KV_OFFLOAD_DISK_DIR" ]; then HC=off; else HC=auto; fi
          fi
          EC="\"offload_prompt_only\":true"
          if [ "$$HC" != off ] && [ "$$HC" != 0 ]; then
            EC="\"max_offload_tokens\":\"$$HC\",$${EC}"
          fi
          if [ -n "$$KV_OFFLOAD_DISK_DIR" ]; then
            EC="$${EC},\"spec_name\":\"TieringOffloadingSpec\",\"eviction_policy\":\"$$OPOLICY\",\"secondary_tiers\":[{\"type\":\"fs\",\"root_dir\":\"$$KV_OFFLOAD_DISK_DIR\",\"n_read_threads\":$$RTHREADS,\"n_write_threads\":$$WTHREADS}]"
            export RADIANCE_LOOKUP_INVALIDATE=1 RADIANCE_FS_FAILED_LOAD_FORGET=1
            echo "[run] fs KV tier ON: root_dir=$$KV_OFFLOAD_DISK_DIR (host-side reaper REQUIRED)"
          fi
          OFF_ARG="--kv-offloading-size $$KV_OFFLOAD_GIB --kv-transfer-config {\"kv_connector\":\"OffloadingConnector\",\"engine_id\":\"$$ENG_ID\",\"kv_role\":\"kv_both\",\"kv_connector_extra_config\":{$$EC}}"
          echo "[run] KV offload ON: cpu tier=$${KV_OFFLOAD_GIB}GiB, head cap=$$HC"
        fi
        ASYNC_ARG="--no-async-scheduling"
        if [ "$$ASCHED" = 1 ]; then ASYNC_ARG="--async-scheduling"; fi
        SPEC_ARG=""
        if [ -n "$$SPEC_CFG" ]; then SPEC_ARG="--speculative-config $$SPEC_CFG"; fi
        TOOL_ARG=""
        if [ -n "$$TOOL_CALL_PARSER" ]; then TOOL_ARG="--enable-auto-tool-choice --tool-call-parser $$TOOL_CALL_PARSER"; fi
        if [ -n "$$REASONING_PARSER" ]; then TOOL_ARG="$$TOOL_ARG --reasoning-parser $$REASONING_PARSER"; fi
        # shellcheck disable=SC2086
        exec /opt/radiance_entrypoint.sh \
          "$$VLLM_MODEL_PATH" --served-model-name "$$VLLM_SERVED_MODEL_NAME" \
          --host 0.0.0.0 --port 8000 \
          --kv-cache-dtype "$$KV_CACHE_DTYPE" --tensor-parallel-size 1 \
          --gpu-memory-utilization 0.98 $$KV_ARG $$OFF_ARG \
          --max-model-len "$$MLEN" --max-num-seqs "$$SEQS" --max-num-batched-tokens "$$CHUNK" \
          --attention-backend R4D \
          $$SPEC_ARG \
          $$ASYNC_ARG \
          --mamba-cache-dtype bfloat16 --mamba-ssm-cache-dtype float16 \
          --compilation-config "{\"cudagraph_capture_sizes\":$$CAPLIST,\"pass_config\":{\"fuse_norm_quant\":true,\"fuse_act_quant\":true}}" \
          --enable-prefix-caching --mamba-cache-mode "$$MAMBA_MODE" \
          $$TOOL_ARG \
          --override-generation-config "$$GEN_CFG" \
          --api-key "$$VLLM_API_KEY" \
          --chat-template "$$CHAT_TEMPLATE"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 60
      start_period: 1800s

  vllm-1:
    image: stilldeadcode/vllm-radiance:0.9.3
    restart: unless-stopped
    privileged: true
    ipc: host
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "993"
      - "44"
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_PTRACE
    # Hard HOST RAM cap (VLLM_MEM_LIMIT). VRAM is NOT bounded by this: GPU device memory
    # is a different cgroup resource, so --gpu-memory-utilization 0.98 still uses all of
    # VRAM. Sized for the default 12 GiB pinned CPU KV tier plus runtime/load headroom
    # (lower KV_OFFLOAD_GIB if you shrink this). Memswap == mem so a runaway cannot refill
    # host swap (which was 100% full at both 2026-09-23 freezes); it is cgroup-OOM-killed
    # instead. Production runs 24g; the repo .env carries a stale single-instance 20g.
    mem_limit: ${VLLM_MEM_LIMIT:-24g}
    memswap_limit: ${VLLM_MEM_LIMIT:-24g}
    networks:
      - coolify
    expose:
      - "8001"
    environment:
      - VLLM_API_KEY=${VLLM_API_KEY:?set VLLM_API_KEY in the Coolify service environment}
      # Deterministic block-hash seed. See the note on vllm-0: without PYTHONHASHSEED
      # vLLM seeds the prefix-cache hash chain from os.urandom, so the SHARED fs tier
      # cannot dedup or read the other instance's blocks. MUST match vllm-0 exactly.
      - PYTHONHASHSEED=0
      # ROCR_VISIBLE_DEVICES = ABSOLUTE card id; HIP_VISIBLE_DEVICES indexes INTO that
      # filtered list, so it must be 0..n-1 for this 1-card container -> HIP=0, NOT 1.
      # (HIP=1 here points past the 1-element list -> "No CUDA GPUs are available".)
      - ROCR_VISIBLE_DEVICES=1
      - HIP_VISIBLE_DEVICES=0
      # Instance index for the shape-label metric (radiance_serve_info{instance=...}).
      - SERVE_RANK=1
      # Model to boot when /model-state/state.json has no entry for this instance yet
      # (fresh boot). Hot-swap restarts read state.json instead; see model-registry.json.
      - MODEL_DEFAULT=${MODEL_DEFAULT:-Qwen3.8-3.6-27B-blend-MXFP4-OCP-GPTQ-mtp}
      # Model identity, drafter, spec depth and KV pin are intentionally NOT set
      # here: the entrypoint resolves them per model from model-registry.json
      # (keyed by this instance's model in state.json). A value set here would be
      # silently overwritten by that eval -- see the model-selection block below.
      # CPU KV-offload tier, GiB (0 = off). Default 12 per PERFORMANCE.md for the prod
      # 2-instance shape: both share the host /dev/shm (ipc: host, 32 G) so the two tiers must
      # SUM to <= ~28 G (both default 12 -> 24 G). The head cap is "auto" (a fair share per
      # concurrent request) so an over-subscribed cycle restores a partial prefix instead of
      # nothing. See PERFORMANCE.md "Productionizing the CPU/disk KV offload".
      - KV_OFFLOAD_GIB=${KV_OFFLOAD_GIB:-12}
      # --- Offload tuning knobs (set per redeploy to A/B in Grafana) ---
      # Primary (CPU/RAM) tier eviction policy: "lru" (default) or "arc". ARC
      # (Adaptive Replacement Cache) balances recency + frequency, which can lift the
      # RAM hit rate on repeated-prefix traffic (RAM hit ~1 s vs disk ~8.6 s). Compare
      # runs with the Grafana row "Offload tuning A/B (eviction / async / fan-out)".
      - KV_OFFLOAD_EVICTION_POLICY=${KV_OFFLOAD_EVICTION_POLICY:-lru}
      # fs secondary-tier I/O pool sizes. Reads are what restore latency waits on; the
      # fs fan-out patch also splits one restore across up to READ threads.
      - KV_OFFLOAD_READ_THREADS=${KV_OFFLOAD_READ_THREADS:-32}
      - KV_OFFLOAD_WRITE_THREADS=${KV_OFFLOAD_WRITE_THREADS:-16}
      # fs fan-out budget (patch_offload_fs_tier.py): MAX = flat batch cap (0 = derive
      # from TARGET_MB / block bytes). Raising it parallelises a single restore. The
      # measured SATA ceiling is ~480 MB/s, so fan-out (not the thread count) is what
      # closes the gap between the ~270 MB/s seen today and the device limit.
      - RADIANCE_FS_FANOUT_TARGET_MB=${RADIANCE_FS_FANOUT_TARGET_MB:-512}
      - RADIANCE_FS_FANOUT_MAX=${RADIANCE_FS_FANOUT_MAX:-32}
      # Async scheduler: 0 = keep --no-async-scheduling (current, conservative);
      # 1 = --async-scheduling (overlap CPU scheduling with GPU work). Test for
      # regressions against the custom R4D/Mamba backends before trusting it.
      - VLLM_ASYNC_SCHEDULING=${VLLM_ASYNC_SCHEDULING:-0}
      # On this stack async refuses KV offload (unvalidated). 1 forces the combination
      # for a test; expect offload-cache corruption if it is genuinely unsafe.
      - RADIANCE_ASYNC_ALLOW_OFFLOAD=${RADIANCE_ASYNC_ALLOW_OFFLOAD:-0}
      # Head-cap override: empty = auto by topology (Mode A "auto", Mode B off). See the KV block.
      - KV_OFFLOAD_HEAD_CAP=${KV_OFFLOAD_HEAD_CAP:-}
      - MAX_NUM_SEQS=${MAX_NUM_SEQS:-8}
      - MAX_NUM_BATCHED_TOKENS=${MAX_NUM_BATCHED_TOKENS:-4096}
      - RADIANCE_OFFLOAD_EAGLE_FIX=${RADIANCE_OFFLOAD_EAGLE_FIX:-1}
      - RADIANCE_OFFLOAD_EAGLE_GROUPS=${RADIANCE_OFFLOAD_EAGLE_GROUPS:-1}
      - RADIANCE_OFFLOAD_DEBUG=${RADIANCE_OFFLOAD_DEBUG:-0}
      - RADIANCE_OFFLOAD_TRACE=${RADIANCE_OFFLOAD_TRACE:-0}
      # Optional fs-tier host bind; set KV_OFFLOAD_DISK_HOST_DIR to put the shared disk store elsewhere.
      # Optional SHARED fs secondary tier: both instances point at the same directory, so a
      # prefix cached by one is loadable by the other (and it survives restarts). This is a
      # path INSIDE the container -- mount a host dir (fast SSD/NVMe) there on BOTH services,
      # and run the reaper (ops/kvcache-reap.sh) against it. Defaults to /kvcache/blocks (the
      # shared bind above); set it to empty for CPU-only (Mode A).
      # Enabling it also turns on the failed-load fix, without which a reaped block hangs a
      # request (patch_offload_fs_tier.py).
      - KV_OFFLOAD_DISK_DIR=${KV_OFFLOAD_DISK_DIR-/kvcache/blocks}
      - HF_HUB_OFFLINE=1
      - VLLM_LOGGING_LEVEL=${VLLM_LOGGING_LEVEL:-INFO}
      - VLLM_NO_USAGE_STATS=1
      - VLLM_ROCM_USE_AITER=1
      - VLLM_ROCM_USE_AITER_UNIFIED_ATTENTION=1
      - VLLM_ROCM_USE_AITER_MHA=0
      - VLLM_ROCM_USE_AITER_MLA=0
      - VLLM_ROCM_USE_AITER_MOE=0
      - VLLM_ROCM_USE_AITER_LINEAR=0
      - VLLM_ROCM_USE_AITER_FP8BMM=0
      - VLLM_ROCM_USE_AITER_FP4BMM=0
      - VLLM_ROCM_USE_AITER_RMSNORM=0
      - NCCL_PROTO=Simple
      - RADIANCE_USE_R4D=1
      - RADIANCE_USE_R4D_AR=1
      - RADIANCE_USE_R4D_AR_QUANT=1
      - RADIANCE_R4D_REPORT=1
      - RADIANCE_AR_QBITS=6
      - RADIANCE_TP_PAD=0
      - RADIANCE_TP_PAD_DRAFTER=0
      - RADIANCE_TP_PAD_STRICT=0
      - RADIANCE_GDN_MERGE_INPROJ=1
      - RADIANCE_FP8_STREAM_TP1=1
      - RADIANCE_GDN_NORM_QUANT=1
      - RADIANCE_GDN_STRIDED_GATES=0
      - RADIANCE_GDN_EMPTY_OUT=0
      - R4D_ATTN_FP8=3
      - RADIANCE_AR_OVERLAP=0
      - RADIANCE_GDN_FUSED_UPDATE=1
      - RADIANCE_GDN_FUSED_MAX_ITEMS=48
      - RADIANCE_GDN_TRACE_SIDX=0
      - RADIANCE_GDN_LAZY=0
      - RADIANCE_AR_QNB=96
      - RADIANCE_AR_QNT=1024
      - MXFP4_CUMODE=0
      - RADIANCE_STEP_TRACE=0
      - RADIANCE_AR_OVERLAP_MIN_M=2048
      - RADIANCE_AR_OVERLAP_SLICES=4
      - RADIANCE_TOPK_TRITON_MIN_ROWS=8
      - RADIANCE_SKINNY_GEMM=1
      - RADIANCE_DFLASH_CALIB_TOKENS=200000
      - RADIANCE_FP8_STREAM=1
      - RADIANCE_RMS_QUANT_FUSION=1
      - RADIANCE_NVFP4_MXFP4=0
      - RADIANCE_NVFP4_EXP=mse
      - RADIANCE_NVFP4_FP8_LAYERS=mxfp4
      - RADIANCE_NVFP4_BF16_LAYERS=in_proj_ba
      - RADIANCE_NVFP4_LMHEAD=bf16
      - RADIANCE_GDN_PATHS=both
      - RADIANCE_GDN_NANTRACE=0
      - VLLM_CACHE_ROOT=/cache/vllm
      - TORCHINDUCTOR_CACHE_DIR=/cache/inductor
      - TRITON_CACHE_DIR=/cache/triton
      - AITER_ROOT_DIR=/cache/aiter
      - TRITON_CACHE_AUTOTUNING=1
      - R4D_SO=/home/juup/.cache/radiance-libr4d/b9e42ab-rx9
    volumes:
      - /home/juup/models:/models
      - /home/juup/.radiance-cache-w4a8-093-gdnm-nqft-fp8s-gnq-tp1s-b:/cache
      - /home/juup/radiance-vllm-mxfp4:/patches:z
      - /home/juup/.cache/radiance-libr4d/b9e42ab-rx9:/r4d:z
      # Shared fs KV tier backing store, mounted into BOTH instances. Point the host side at a
      # dedicated SSD/volume (or a loop volume from ops/make-kvcache-volume.sh). Docker creates
      # the default path if absent. The host-side reaper runs against the same directory.
      - ${KV_OFFLOAD_DISK_HOST_DIR:-/var/lib/radiance-kvcache}:/kvcache
      - /home/juup/.cache/huggingface:/root/.cache/huggingface
      # Shared model-swap state (READ-ONLY here): the entrypoint picks its model from
      # state.json at boot; model-controller is the sole writer. See model-registry.json.
      - ${MODEL_STATE_HOST_DIR:-/var/lib/radiance-model-state}:/model-state:ro
      - serve-shape:/tmp/serve-shape
    entrypoint:
      - bash
      - -lc
      - |
        set -e
        # ---- model selection (hot-swap; see model-registry.json) ----
        # The registry (repo root -> /patches) maps each servable model to its
        # path / drafter / spec / calibrated KV pin. The desired model comes from
        # /model-state/state.json (written by model-controller) so a swap restart
        # boots the NEW model; a fresh boot falls back to MODEL_DEFAULT, then the
        # first registry entry. Everything below (KV pin, capture ladder, spec cfg)
        # then resolves from these values unchanged.
        RID=$${SERVE_RANK:-0}
        INST="vllm-$$RID"
        [ -f /patches/aijuus/model-registry.json ] || { echo "[run] FATAL: /patches/aijuus/model-registry.json missing (repo bind not mounted?)" >&2; exit 1; }
        eval "$$(python3 - "$$INST" <<'PY'
        import json, os, sys
        inst = sys.argv[1]
        full = json.load(open("/patches/aijuus/model-registry.json"))
        reg = {k: v for k, v in full.items() if not k.startswith("_")}
        dflt = full.get("_defaults", {})
        name = os.environ.get("MODEL_DEFAULT")
        try:
            st = json.load(open("/model-state/state.json"))
            e = st.get(inst)
            if e and e.get("model") in reg:
                name = e["model"]
        except Exception:
            pass
        if not name or name not in reg:
            name = sorted(reg)[0]
        e = reg[name]
        def q(s):
            return "'" + str(s).replace("'", "'\\''") + "'"
        def pick(field, default=None):
            return e.get(field, dflt.get(field, default))
        print("MODEL_NAME=" + q(name))
        print("VLLM_MODEL_PATH=" + q(e["path"]))
        print("VLLM_SERVED_MODEL_NAME=" + q(e.get("served_name", name)))
        print("SPEC_DRAFTER=" + q(e.get("drafter", "")))
        print("SPEC_METHOD=" + q(e.get("spec_method", "none")))
        print("SPEC_TOKENS=" + q(e.get("spec_tokens", "")))
        print("KV_CACHE_MEMORY=" + q(e.get("kv_cache_memory", "")))
        print("VERIFY_HEAD=" + q(e.get("verify_head", "")))
        print("MAX_MODEL_LEN=" + q(pick("max_model_len", "")))
        print("KV_CACHE_DTYPE=" + q(pick("kv_cache_dtype", "fp8")))
        print("CHAT_TEMPLATE=" + q(pick("chat_template", "")))
        print("TOOL_CALL_PARSER=" + q(pick("tool_call_parser", "")))
        print("REASONING_PARSER=" + q(pick("reasoning_parser", "")))
        gc = pick("generation_config", None)
        print("GEN_CFG=" + q(json.dumps(gc) if gc else "{}"))
        env = dict(dflt.get("server_env", {}))
        env.update(e.get("server_env", {}))
        for k in sorted(env):
            print("export " + k + "=" + q(env[k]))
        PY
        )"
        echo "[run] model selected: $$MODEL_NAME path=$$VLLM_MODEL_PATH spec=$$SPEC_METHOD/$$SPEC_TOKENS kv=$$KV_CACHE_MEMORY vhead=$${VERIFY_HEAD:-auto}"
        # ---- parametrized serving shape (env vars, defaults = measured TP=1) ----
        # NOTE: the vllm entrypoint uses DOUBLE dollars ($$) throughout so
        # Compose passes them to the container; every other service in this
        # file uses single $. Do not "fix" these to single $ -- Coolify would
        # interpolate them at deploy time and the prelude would resolve empty.
        SEQS=$${MAX_NUM_SEQS:-8}
        MLEN=$${MAX_MODEL_LEN:-160000}
        CHUNK=$${MAX_NUM_BATCHED_TOKENS:-4096}
        SMETHOD=$${SPEC_METHOD:-dflash}
        case "$$SMETHOD" in dflash|mtp|none) ;; *) echo "SPEC_METHOD must be dflash, mtp or none, got: $$SMETHOD" >&2; exit 1 ;; esac
        # VERIFY_HEAD is a PER-MODEL setting from model-registry.json (`verify_head`):
        # the int2 verify-head GEMM is +2.9% decode under dflash and neutral under mtp.
        # If a model entry omits it, fall back to the method default.
        if [ -z "$${VERIFY_HEAD:-}" ]; then
          if [ "$$SMETHOD" = dflash ]; then VERIFY_HEAD=1; else VERIFY_HEAD=0; fi
        fi
        export RADIANCE_VERIFY_HEAD="$$VERIFY_HEAD"
        if [ "$$SMETHOD" = none ]; then
          SPEC=0
        elif [ -z "$${SPEC_TOKENS:-}" ]; then
          if [ "$$SMETHOD" = dflash ]; then SPEC=16; else SPEC=4; fi
        else
          SPEC="$$SPEC_TOKENS"
        fi
        # KV sizing. The calibrated pin comes from model-registry.json
        # (kv_cache_memory, emitted by the model-selection eval above). It is
        # REQUIRED whenever maxlen is 160000, where vLLM's own profiling finds
        # only ~4.81 GiB, below the ~5.71 GiB a single 160k request needs.
        # A registry entry with no kv_cache_memory (or 0) forces profiling.
        if [ -n "$${KV_CACHE_MEMORY:-auto}" ] && [ "$${KV_CACHE_MEMORY:-auto}" != auto ] && [ "$${KV_CACHE_MEMORY:-auto}" != 0 ]; then
          KMEM="$$KV_CACHE_MEMORY"
          KV_SRC=explicit
        else
          KV_SRC=profiled
          KMEM=""
        fi
        # Prefill all-reduce gate from the chunk (CHUNK*5120*2/1024+4096) so a
        # non-default chunk cannot silently drop prefill onto RCCL.
        # Offload tuning knobs, resolved once. Used by both the transfer-config JSON
        # and the shape-label metric the Grafana "Offload tuning A/B" row reads, so a
        # policy/thread/async change shows up as a label flip on the next redeploy.
        OPOLICY=$${KV_OFFLOAD_EVICTION_POLICY:-lru}
        ASCHED=$${VLLM_ASYNC_SCHEDULING:-0}
        RTHREADS=$${KV_OFFLOAD_READ_THREADS:-32}
        WTHREADS=$${KV_OFFLOAD_WRITE_THREADS:-16}
        FANOUT=$${RADIANCE_FS_FANOUT_MAX:-32}
        RID=$${SERVE_RANK:-0}
        OVMODE=off
        if [ -n "$$KV_OFFLOAD_GIB" ] && [ "$$KV_OFFLOAD_GIB" != 0 ]; then OVMODE=on; fi
        MAMBA_MODE=$${MAMBA_CACHE_MODE:-align}
        # ---- Async-scheduling preflight (see PERFORMANCE.md "Async scheduling") -----------------
        # vLLM HARD-gates --async-scheduling (config/vllm.py:1081+): the spec method must be an
        # EAGLE-family type (mtp/dflash qualify), the executor must support it (uniproc/mp do),
        # and disable_padded_drafter_batch must be FALSE -- so async and the UNPADDED drafter are
        # ONE switch. Derive UNPAD from ASCHED (mirrors serve-mxfp4.sh) so the flag cannot boot
        # into vLLM's hard error. We also refuse the combinations this patched stack has NOT
        # validated, so flipping the flag can never silently corrupt hybrid/spec/offload state.
        if [ "$$ASCHED" = 1 ]; then
          UNPAD=false
          # Hybrid/Mamba spec-decode + async only syncs num_accepted_tokens in align mode
          # (gpu_model_runner.py skips the CPU sync for async non-align). We only run align.
          if [ "$$MAMBA_MODE" != align ]; then
            echo "[run] FATAL: VLLM_ASYNC_SCHEDULING=1 requires mamba cache mode align" >&2
            exit 1
          fi
          # async + KV offload is unvalidated here (the offload/eagle patches assume sync
          # scheduler semantics). Refuse unless explicitly forced for a test.
          if [ "$$OVMODE" = on ] && [ "$${RADIANCE_ASYNC_ALLOW_OFFLOAD:-0}" != 1 ]; then
            echo "[run] FATAL: async scheduling + KV offload is unvalidated (offload patches assume sync)." >&2
            echo "      Unset KV_OFFLOAD_GIB, or set RADIANCE_ASYNC_ALLOW_OFFLOAD=1 to force a test." >&2
            exit 1
          fi
          echo "[run] async scheduling ENABLED (padded drafter; async_allow_offload=$${RADIANCE_ASYNC_ALLOW_OFFLOAD:-0})"
        else
          UNPAD=true
        fi
        AR_MAX_KB=$$(( $$CHUNK * 5120 * 2 / 1024 + 4096 ))
        # Cudagraph capture ceiling = SEQS*(SPEC+1), stock ladder trimmed to it
        # (mirrors serve-mxfp4.sh: SEQS=8 SPEC=16 -> 136, so the ladder runs to 256).
        CAP=$$(( $$SEQS * ($$SPEC + 1) ))
        SIZES=""
        for s in 1 2 4 8 16 24 32 40 48 56 64 72 80 88 96 104 112 120 128 \
                  136 144 152 160 168 176 184 192 200 208 216 224 232 240 248 256; do
          [ "$$s" -le "$$CAP" ] && SIZES="$${SIZES:+$$SIZES,}$$s"
        done
        CAPLIST="[$$SIZES]"
        # Speculative config. mtp needs no drafter checkpoint; dflash does; none disables it.
        if [ "$$SMETHOD" = none ]; then
          SPEC_CFG=""
        elif [ "$$SMETHOD" = mtp ]; then
          SPEC_CFG="{\"method\":\"mtp\",\"num_speculative_tokens\":$$SPEC,\"attention_backend\":\"R4D\",\"disable_padded_drafter_batch\":$$UNPAD}"
        else
          SPEC_CFG="{\"method\":\"dflash\",\"model\":\"$$SPEC_DRAFTER\",\"num_speculative_tokens\":$$SPEC,\"attention_backend\":\"TRITON_ATTN\",\"disable_padded_drafter_batch\":$$UNPAD,\"draft_sample_method\":\"greedy\"}"
        fi
        # Expose the resolved shape for logs + Prometheus labels.
        export RADIANCE_AR_MAX_KB="$$AR_MAX_KB"
        export SERVE_KV_SOURCE="$$KV_SRC"
        export SERVE_SPEC_RESOLVED="$$SPEC"
        echo "[run] TP=1 shape: seqs=$$SEQS maxlen=$$MLEN chunk=$$CHUNK kv=$${KMEM:-none}($$KV_SRC) spec=$$SMETHOD/$$SPEC ar_max_kb=$$AR_MAX_KB captures=$$CAPLIST"
        SP=/opt/vllm/lib/python3.12/site-packages
        cd /patches
        python3 patch_quark_mxfp4.py
        python3 patch_nvfp4_mxfp4.py
        python3 patch_tp3_pad.py
        python3 patch_ar_maxbytes.py
        python3 patch_topk_triton_rows.py
        python3 patch_dflash_calib.py
        python3 patch_dflash_mxfp4_kv.py
        python3 patch_rmsquant_fusion.py
        python3 patch_verify_head.py
        python3 patch_kv_group_size.py
        python3 patch_topk_composite.py
        python3 patch_gdn_shared_build.py
        python3 patch_dflash_selector_topk.py
        python3 patch_gdn_merge_inproj.py
        python3 patch_dynwidth.py
        python3 patch_async_dynwidth.py
        python3 patch_step_trace.py
        python3 patch_ar_geometry.py
        python3 patch_ar_qbits.py
        python3 patch_ar_3rank.py
        python3 patch_gdn_glue.py
        if [ "$${RADIANCE_GDN_LAZY:-0}" = 1 ]; then python3 patch_gdn_lazy.py; fi
        python3 patch_qwen3_thinkoff.py || echo "[radiance] WARNING: thinkoff patch did not apply; thinking-off requests will return empty content"
        # ---- KV offload patches (mirror serve-mxfp4.sh). All inert unless KV_OFFLOAD_GIB
        # turns the OffloadingConnector on; they are what make the CPU/fs tiers correct.
        if [ "$${RADIANCE_OFFLOAD_DEBUG:-0}" = 1 ]; then python3 aijuus/patch_offload_debug.py; fi   # diagnostic only
        if [ "$${RADIANCE_OFFLOAD_EAGLE_FIX:-1}" != 0 ]; then python3 aijuus/patch_offload_eagle_fallback.py; fi   # hybrid (Mamba/SWA) correctness
        if [ "$${RADIANCE_OFFLOAD_EAGLE_GROUPS:-1}" != 0 ]; then python3 aijuus/patch_offload_eagle_groups.py; fi   # per-group restore (~2x faster); 0 = coarse fallback
        python3 aijuus/patch_mamba_stride.py \
          || echo "[radiance] WARNING: mamba store-cadence patch did NOT apply -- every chunk stores all six Mamba groups"
        python3 aijuus/patch_offload_swa_touch.py \
          || echo "[radiance] WARNING: swa-align/touch-order patch did NOT apply -- heads still age out"
        python3 aijuus/patch_offload_fs_tier.py \
          || echo "[radiance] WARNING: fs-tier patch did NOT apply -- do NOT enable the fs disk tier"
        python3 aijuus/patch_offload_head_cap.py   # head-only CPU retention; inert unless max_offload_tokens/RADIANCE_OFFLOAD_MAX_TOKENS is set
        if [ "$${RADIANCE_OFFLOAD_TRACE:-0}" = 1 ]; then python3 aijuus/patch_offload_trace.py; fi   # deep diagnostic
        cp mxfp4-configs/*.json "$$SP"/aiter/ops/triton/configs/gemm/
        cp radiance_preamble.py /opt/radiance_preamble.py
        cp radiance_nvfp4.py radiance_mxfp4.py radiance_gdn.py radiance_gdn_lazy.py radiance_rmsquant.py radiance_drafthead.py radiance_verifyhead.py radiance_gdnmerge.py radiance_aroverlap.py radiance_topk.py radiance_arnq.py radiance_tp3pad.py "$$SP"/
        hipcc -O3 -w -std=c++17 -fPIC -shared --offload-arch=gfx1201 $$([ "$${MXFP4_CUMODE:-0}" = 1 ] && echo -mcumode) $$(python3 -m pybind11 --includes) radiance_mxfp4_fp8.hip -o "$$SP"/radiance_mxfp4_fp8.so
        if [ -n "$${R4D_SO:-}" ] && [ -f /r4d/r4d.so ]; then
          cp /r4d/r4d.so "$$SP"/r4d.so
          echo "[radiance] using patched r4d.so from $$R4D_SO"
        fi
        # Shape labels for Prometheus (written to a throwaway path; this file
        # relies on scraping each instance's /metrics with a job label instead,
        # so per-instance shape is read off the instance's own logs).
        rm -f /tmp/serve-shape/serve_shape.prom
        printf 'radiance_serve_info{instance="%s",max_num_seqs="%s",max_model_len="%s",max_num_batched_tokens="%s",kv_source="%s",spec_method="%s",spec_tokens="%s",offload_policy="%s",offload_mode="%s",async_sched="%s",read_threads="%s",write_threads="%s",fanout_max="%s"} 1\n' \
          "$$RID" "$$SEQS" "$$MLEN" "$$CHUNK" "$$KV_SRC" "$$SMETHOD" "$$SPEC" "$$OPOLICY" "$$OVMODE" "$$ASCHED" "$$RTHREADS" "$$WTHREADS" "$$FANOUT" > /tmp/serve-shape/serve_shape_$$RID.prom
        echo "[run] shape labels: kv=$$KV_SRC spec=$$SMETHOD/$$SPEC"
        # ---- stale CPU-KV-offload region sweep (THIS instance only) ----
        # vLLM names its CPU offload tier /dev/shm/vllm_offload_<engine_id>.mmap
        # and only unlinks it in cleanup(), so a crashed/killed start leaks one
        # (it used a fresh uuid each boot). Enough leaks fill the 32G host tmpfs
        # and the next start then dies in MADV_POPULATE_WRITE with EFAULT
        # (Errno 14) -- the 2026-09-28 outage. engine_id is pinned per instance
        # below (radrank$$SERVE_RANK), so our own stale region has a known name and is
        # removed here BEFORE the engine re-creates it. Only our own name is
        # matched: ipc: host shares /dev/shm with the peer instance, whose live
        # region must never be touched.
        # Hardening: engine_id names the shared /dev/shm region, so it MUST
        # be distinct per instance. Fail fast if SERVE_RANK is unset/empty --
        # a blank rank would alias the peer (both use 0) and make each
        # instance sweep the other's live region. A uuid is un-sweepable and
        # a hostname changes on container recreate (would orphan the sweep),
        # so the stable, unique per-instance rank is the right token.
        : "$${SERVE_RANK:?SERVE_RANK must be set to a distinct value per instance (0/1)}"
        ENG_ID="radrank$$SERVE_RANK"
        for _f in /dev/shm/vllm_offload_$${ENG_ID}*.mmap; do
          [ -e "$${_f}" ] || continue
          echo "[run] sweeping stale KV-offload region $$_f"
          rm -f "$${_f}"
        done
        cd /
        # Final argv assembled here from the resolved shape (no static command:
        # compose cannot do arithmetic or conditionals, the entrypoint can).
        KV_ARG=""
        [ -n "$$KMEM" ] && KV_ARG="--kv-cache-memory $$KMEM"
        # KV offload (env-gated, default off). --kv-offloading-size sets cpu_bytes_to_use AND
        # selects OffloadingConnector; the JSON only adds extra_config.
        # Head cap (patch_offload_head_cap.py) is what distinguishes the two modes:
        #   Mode A (CPU only, no KV_OFFLOAD_DISK_DIR): max_offload_tokens="auto" -- fit the CPU
        #     tier exactly, so over-subscription restores a contiguous partial prefix, never nothing.
        #   Mode B (CPU + shared fs, KV_OFFLOAD_DISK_DIR set): NO cap -- the disk holds the
        #     overflow, and a per-request cap would defeat it. Reaper REQUIRED.
        # KV_OFFLOAD_HEAD_CAP overrides the topology default: "auto" | <N> | "off".
        # No spaces in the JSON, so word-splitting the unquoted OFF_ARG is safe.
        OFF_ARG=""
        if [ -n "$$KV_OFFLOAD_GIB" ] && [ "$$KV_OFFLOAD_GIB" != 0 ]; then
          HC="$${KV_OFFLOAD_HEAD_CAP:-}"
          if [ -z "$$HC" ]; then
            if [ -n "$$KV_OFFLOAD_DISK_DIR" ]; then HC=off; else HC=auto; fi
          fi
          EC="\"offload_prompt_only\":true"
          if [ "$$HC" != off ] && [ "$$HC" != 0 ]; then
            EC="\"max_offload_tokens\":\"$$HC\",$${EC}"
          fi
          if [ -n "$$KV_OFFLOAD_DISK_DIR" ]; then
            EC="$${EC},\"spec_name\":\"TieringOffloadingSpec\",\"eviction_policy\":\"$$OPOLICY\",\"secondary_tiers\":[{\"type\":\"fs\",\"root_dir\":\"$$KV_OFFLOAD_DISK_DIR\",\"n_read_threads\":$$RTHREADS,\"n_write_threads\":$$WTHREADS}]"
            export RADIANCE_LOOKUP_INVALIDATE=1 RADIANCE_FS_FAILED_LOAD_FORGET=1
            echo "[run] fs KV tier ON: root_dir=$$KV_OFFLOAD_DISK_DIR (host-side reaper REQUIRED)"
          fi
          OFF_ARG="--kv-offloading-size $$KV_OFFLOAD_GIB --kv-transfer-config {\"kv_connector\":\"OffloadingConnector\",\"engine_id\":\"$$ENG_ID\",\"kv_role\":\"kv_both\",\"kv_connector_extra_config\":{$$EC}}"
          echo "[run] KV offload ON: cpu tier=$${KV_OFFLOAD_GIB}GiB, head cap=$$HC"
        fi
        ASYNC_ARG="--no-async-scheduling"
        if [ "$$ASCHED" = 1 ]; then ASYNC_ARG="--async-scheduling"; fi
        SPEC_ARG=""
        if [ -n "$$SPEC_CFG" ]; then SPEC_ARG="--speculative-config $$SPEC_CFG"; fi
        TOOL_ARG=""
        if [ -n "$$TOOL_CALL_PARSER" ]; then TOOL_ARG="--enable-auto-tool-choice --tool-call-parser $$TOOL_CALL_PARSER"; fi
        if [ -n "$$REASONING_PARSER" ]; then TOOL_ARG="$$TOOL_ARG --reasoning-parser $$REASONING_PARSER"; fi
        # shellcheck disable=SC2086
        exec /opt/radiance_entrypoint.sh \
          "$$VLLM_MODEL_PATH" --served-model-name "$$VLLM_SERVED_MODEL_NAME" \
          --host 0.0.0.0 --port 8001 \
          --kv-cache-dtype "$$KV_CACHE_DTYPE" --tensor-parallel-size 1 \
          --gpu-memory-utilization 0.98 $$KV_ARG $$OFF_ARG \
          --max-model-len "$$MLEN" --max-num-seqs "$$SEQS" --max-num-batched-tokens "$$CHUNK" \
          --attention-backend R4D \
          $$SPEC_ARG \
          $$ASYNC_ARG \
          --mamba-cache-dtype bfloat16 --mamba-ssm-cache-dtype float16 \
          --compilation-config "{\"cudagraph_capture_sizes\":$$CAPLIST,\"pass_config\":{\"fuse_norm_quant\":true,\"fuse_act_quant\":true}}" \
          --enable-prefix-caching --mamba-cache-mode "$$MAMBA_MODE" \
          $$TOOL_ARG \
          --override-generation-config "$$GEN_CFG" \
          --api-key "$$VLLM_API_KEY" \
          --chat-template "$$CHAT_TEMPLATE"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 60
      start_period: 1800s

  # ---------------------------------------------------------------- model router (LB + hot-swap)
  # The public OpenAI-compatible endpoint (:8100). Replaces the previous HAProxy
  # data path: the stock haproxy image has no request-time lua and cannot
  # parse/rewrite the JSON `model` field, so it could neither serve an unloaded
  # model with a loaded one nor advertise registry models in GET /v1/models.
  #
  # model-router.py (repo root, bind-mounted read-only) does:
  #   * least-in-flight load balancing across the two instances when both serve
  #     the same model (ties rotate, so sequential bursts still spread too),
  #   * model-aware routing from state.json (written by model-controller),
  #   * for a registered-but-unloaded model: writes /model-state/trigger.json
  #     (the swap trigger) and, if another model is ready, rewrites `model` in the
  #     request body to that model so the user never sees an error while the
  #     selected model loads; if NOTHING is ready (e.g. a future TP=2 model that
  #     occupies both ranks) it holds the request open with SSE keep-alives until
  #     the model is ready, then streams the real answer,
  #   * GET /v1/models advertising every registry model (so a client can select a
  #     model that is not loaded yet -- selecting it is what triggers a swap),
  #   * GET /health (Coolify) and GET /metrics (Prometheus).
  #
  # state.json entries carry {model, ready, endpoint, rank}; ranks sharing an
  # endpoint collapse into ONE routing target, so a TP=2 deployment needs no
  # router change later -- only model-controller gains multi-rank swap logic.
  model-router:
    image: python:3.13-alpine
    restart: unless-stopped
    networks:
      - coolify
    depends_on:
      - vllm-0
      - vllm-1
      - model-controller
    environment:
      - VLLM_API_KEY=${VLLM_API_KEY:?set VLLM_API_KEY in the Coolify service environment}
      - PORT=8100
      # How long to hold a request for a registered-but-unloaded model when no
      # other model is ready to answer meanwhile (the TP=2 case), in seconds.
      - HOLD_TIMEOUT=${HOLD_TIMEOUT:-3600}
      # HOLD_TIMEOUT/KEEPALIVE_SECONDS/POLL_SECONDS/UPSTREAM_TIMEOUT also default
      # in the script; override them here to A/B the hold behaviour.
    volumes:
      # state.json is read per request; trigger.json is written here (so the dir
      # is mounted rw even though only trigger.json is new).
      - ${MODEL_STATE_HOST_DIR:-/var/lib/radiance-model-state}:/model-state
      # NOTE: Coolify mangles "${VAR:-default}/suffix" in bind specs into
      # "<default>:" (empty target -> "empty section between colons"), so the
      # full host file path must be the variable's own default, with no suffix.
      # Env: MODEL_REGISTRY_FILE / MODEL_ROUTER_FILE / MODEL_CONTROLLER_FILE are
      # FULL host file paths and supersede MODEL_REGISTRY_HOST_DIR (no longer read).
      - ${MODEL_REGISTRY_FILE:-/home/juup/radiance-vllm-mxfp4/aijuus/model-registry.json}:/model-registry.json:ro
      - ${MODEL_ROUTER_FILE:-/home/juup/radiance-vllm-mxfp4/aijuus/model-router.py}:/code/model-router.py:ro
    command:
      - python3
      - /code/model-router.py
    expose:
      - "8100"   # public endpoint (Traefik) + Prometheus /metrics

  # ---------------------------------------------------------------- model hot-swap
  # Watches /model-state/trigger.json (written by model-router when a request
  # arrives for a registered model no instance is ready to serve) and swaps ONE
  # instance to it: state.json marks it not-ready (the router stops using it and
  # serves its traffic with another ready model meanwhile) -> docker restart boots
  # the new model from model-registry.json -> health poll -> ready flips and
  # routing follows. The other instance is never touched, so the previously-loaded
  # model keeps serving throughout the swap (no error window). state.json also
  # self-heals against /v1/models. Find the container by compose service label
  # (Coolify renames containers), so a manual restart stays inside Coolify's
  # management. See model-controller.py.
  model-controller:
    image: python:3.13-alpine
    restart: unless-stopped
    networks:
      - coolify
    depends_on:
      - vllm-0
      - vllm-1
    environment:
      - VLLM_API_KEY=${VLLM_API_KEY:?set VLLM_API_KEY in the Coolify service environment}
      - MODEL_DEFAULT=${MODEL_DEFAULT:-Qwen3.8-3.6-27B-blend-MXFP4-OCP-GPTQ-mtp}
      # How long to wait for the swapped instance to become healthy before giving up.
      - SWAP_TIMEOUT=${SWAP_TIMEOUT:-3600}
      # Before restarting, wait up to this long for the chosen instance's in-flight
      # requests to finish (drain) so a swap does not drop active work. 0 = no wait.
      - IDLE_WAIT_SECONDS=${IDLE_WAIT_SECONDS:-300}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MODEL_STATE_HOST_DIR:-/var/lib/radiance-model-state}:/model-state
      # See model-router: full host path is the variable default (no /suffix).
      - ${MODEL_REGISTRY_FILE:-/home/juup/radiance-vllm-mxfp4/aijuus/model-registry.json}:/model-registry.json:ro
      - ${MODEL_CONTROLLER_FILE:-/home/juup/radiance-vllm-mxfp4/aijuus/model-controller.py}:/code/model-controller.py:ro
    command:
      - python3
      - /code/model-controller.py

  # ---------------------------------------------------------------- observability
  # Carried over from the single-GPU file, with the vLLM scrape updated to BOTH
  # backends (job label "vllm", instance label distinguishes them) and model-router
  # metrics added as a scrape job. Everything else (node-exporter, gpu-exporter,
  # grafana) is unchanged.
  init-observability:
    image: busybox:1.37
    restart: "no"
    networks:
      - coolify
    volumes:
      - prometheus-config:/out/prometheus
      - grafana-provisioning:/out/grafana-provisioning
      - grafana-dashboards:/out/grafana-dashboards
      - gpu-exporter-code:/out/gpu-exporter
      - kvcache-exporter-code:/out/kvcache-exporter
    command:
      - sh
      - -c
      - |
        mkdir -p /out/prometheus /out/prometheus/rules /out/grafana-provisioning/datasources /out/grafana-provisioning/dashboards /out/grafana-dashboards /out/gpu-exporter /out/kvcache-exporter
        cat > /out/prometheus/prometheus.yml <<'EOF'
        global:
          scrape_interval: 15s
          evaluation_interval: 15s
        rule_files:
          - /etc/prometheus/rules/*.yml
        scrape_configs:
          - job_name: vllm
            metrics_path: /metrics
            static_configs:
              - targets: ['vllm-0:8000', 'vllm-1:8001']
          - job_name: model-router
            metrics_path: /metrics
            static_configs:
              - targets: ['model-router:8100']
          - job_name: node
            static_configs:
              - targets: ['node-exporter:9100']
          - job_name: gpu
            static_configs:
              - targets: ['gpu-exporter:9101']
          - job_name: kvcache
            static_configs:
              - targets: ['kvcache-exporter:9102']
          - job_name: prometheus
            static_configs:
              - targets: ['localhost:9090']
        EOF
        cat > /out/prometheus/rules/kvcache.yml <<'KVRULES'
        groups:
          - name: kvcache-tier
            rules:
              - alert: KVCacheTierNearCap
                expr: radiance_kvcache_bytes / radiance_kvcache_max_bytes > 0.90
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "fs KV tier above 90% of its hard cap"
                  description: "radiance_kvcache_bytes is {{ $$value | humanizePercentage }} of radiance_kvcache_max_bytes (KVCACHE_MAX_GIB). Check the reaper completed and the disk is not shared-pressure-bound."
              - alert: KVCacheTierOverCap
                expr: radiance_kvcache_bytes > radiance_kvcache_max_bytes
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "fs KV tier OVER its hard cap"
                  description: "radiance_kvcache_bytes > radiance_kvcache_max_bytes for 5m; the host reaper is not keeping up or did not run. The reaper also exits non-zero on this."
          - name: host-memory
            rules:
              - alert: HostMemoryPressure
                expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "host MemAvailable below 10%"
                  description: "Host memory pressure; freeze/OOM risk. Check vLLM mem_limit, KV_OFFLOAD_GIB, and swap."
              - alert: HostSwapExhausted
                expr: (node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) / node_memory_SwapTotal_bytes > 0.90
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "host swap above 90% used"
                  description: "Swap nearly exhausted. Both 2026-09-23 freezes had swap 100% full."
          - name: gpu-limits
            rules:
              - alert: GpuPowerLimitSustained
                expr: amd_gpu_power_watts / clamp_min(amd_gpu_power_cap_watts, 1) > 0.98
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "GPU drawing its power cap"
                  description: "amd_gpu_power_watts is above 98% of amd_gpu_power_cap_watts for 5m; the GPU is power-limited, so clocks are being capped. Look at the throttle reasons panel for corroboration."
              - alert: GpuThermalHeadroomLow
                expr: (amd_gpu_temp_junction_crit_celsius - amd_gpu_temp_junction_celsius) < 5
                for: 2m
                labels:
                  severity: warning
                annotations:
                  summary: "GPU junction temperature within 5C of its crit threshold"
                  description: "Junction temperature is close to the crit limit; thermal throttling is imminent or active. Check airflow and the throttle reasons panel."
          - name: gpu-faults
            rules:
              - alert: GpuAerCorrectableErrors
                expr: increase(amd_gpu_aer_correctable_total[15m]) > 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "PCIe correctable errors on a GPU"
                  description: "amd_gpu_aer_correctable_total increased in the last 15m. Usually harmless (bad TLP/DLLP, replays) but a rising rate can precede link degradation."
              - alert: GpuAerFatalErrors
                expr: increase(amd_gpu_aer_fatal_total[15m]) > 0
                for: 1m
                labels:
                  severity: critical
                annotations:
                  summary: "PCIe fatal/unrecoverable error on a GPU"
                  description: "amd_gpu_aer_fatal_total increased. PCIe link is faulting; expect resets or dropped transfers."
              - alert: GpuRasFatalEvent
                expr: increase(amd_gpu_ras_fatal_total[15m]) > 0 or amd_gpu_vram_bad_pages > 0
                for: 1m
                labels:
                  severity: critical
                annotations:
                  summary: "GPU RAS fatal event or VRAM bad pages"
                  description: "A fatal RAS event or bad VRAM page was reported. Uncorrectable GPU memory fault; plan a maintenance window."
