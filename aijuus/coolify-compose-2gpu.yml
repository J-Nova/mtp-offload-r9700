            {
              "id": 113,
              "type": "text",
              "title": "How to run the A/B",
              "gridPos": {
                "h": 7,
                "w": 24,
                "x": 0,
                "y": 128
              },
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "options": {
                "mode": "markdown",
                "content": "**A/B the offload tuning from Coolify env -- no code change.**\n\n1. Set the env var on **both** vllm services (must match), then Redeploy:\n   - `KV_OFFLOAD_EVICTION_POLICY=arc` (default `lru`) -- headline test.\n   - `VLLM_ASYNC_SCHEDULING=1` (default `0` = keep `--no-async-scheduling`) -- watch TTFT/throughput **and** correctness (spec decode + R4D/Mamba).\n   - `KV_OFFLOAD_READ_THREADS`/`KV_OFFLOAD_WRITE_THREADS` (default 32/16) and `RADIANCE_FS_FANOUT_MAX`/`RADIANCE_FS_FANOUT_TARGET_MB` (default 32/512) -- restore-throughput levers.\n2. Run the **same** load for a fixed window (e.g. `offload-e2e.py --mode all --tokens 60000 --projects 16`).\n3. Compare this row across windows: `Active offload config` confirms the settings, `Offload hit rate %` is the LRU-vs-ARC signal, TTFT panels show the RAM-vs-disk shift.\n\n_RAM-tier occupancy is not observable (region is pre-allocated/pinned), so hit quality is judged via the connector hit rate and TTFT, not a cache-size gauge._"
              }
            },
