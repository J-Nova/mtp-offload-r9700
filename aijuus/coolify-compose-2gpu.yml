        #!/usr/bin/env python3
        """AMD GPU (per card) + CPU sensor exporter for Prometheus. Stdlib only, reads /sys.
        Reports EVERY drm card (card1, card2, ...) with a gpu label so a multi-GPU host
        shows all cards, not just the first one found."""
        import glob
        import os
        import struct
        import time
        from http.server import BaseHTTPRequestHandler, HTTPServer
        SYS = "/host/sys" if os.path.isdir("/host/sys/class/drm") else "/sys"
        PORT = 9101
        def read(path):
            try:
                with open(path) as handle:
                    return handle.read().strip()
            except OSError:
                return None
        def num(path, scale=1.0):
            value = read(path)
            if value is None:
                return None
            try:
                return float(value) / scale
            except ValueError:
                return None
        def cards():
            out = []
            for hit in sorted(glob.glob(SYS + "/class/drm/card*/device/gpu_busy_percent")):
                dev = os.path.dirname(hit)
                name = os.path.basename(os.path.dirname(dev))
                out.append((name, dev))
            return out
        def amdgpu_hwmon(dev):
            for name_path in sorted(glob.glob(dev + "/hwmon/hwmon*/name")):
                if read(name_path) == "amdgpu":
                    return os.path.dirname(name_path)
            return None
        def cpu_temp():
            best = None
            for name_path in glob.glob(SYS + "/class/hwmon/hwmon*/name"):
                if read(name_path) not in ("k10temp", "zenpower", "coretemp"):
                    continue
                for temp_path in glob.glob(os.path.dirname(name_path) + "/temp*_input"):
                    value = num(temp_path, 1000.0)
                    if value is not None and (best is None or value > best):
                        best = value
            return best
        def link_speed_gt(path):
            raw = read(path)
            if not raw:
                return None
            try:
                return float(raw.split()[0])
            except (ValueError, IndexError):
                return None
        def gpu_metrics_throttle(dev):
            """(throttle_status, indep_throttle_status) u32s from the gpu_metrics
            blob (format_rev=1, content_rev 1-3). None when the GPU is
            runtime-suspended or the read is EBUSY or the layout is unknown:
            while suspended the driver can return a stale non-zero bitmask
            (observed 2 = THERMAL at idle), which must not be surfaced."""
            if (read(dev + "/power/runtime_status") or "") == "suspended":
                return None, None
            try:
                with open(dev + "/gpu_metrics", "rb") as handle:
                    data = handle.read()
            except OSError:
                return None, None
            if len(data) < 76 or data[2] != 1 or not (1 <= data[3] <= 3):
                return None, None
            status = struct.unpack_from("<I", data, 68)[0]
            if status == 0xFFFFFFFF:
                status = None
            # indep_throttle_status is a u64 at offset 112 in content_rev 3 only;
            # offset 72 is current_fan_speed|pcie_link_width (not a throttle mask).
            indep = None
            if data[3] == 3 and len(data) >= 120:
                value = struct.unpack_from("<Q", data, 112)[0]
                if value != 0xFFFFFFFFFFFFFFFF:
                    indep = value
            return status, indep
        def ras_event_counts(dev):
            """Fatal / poison counters from ras/event_state. Reliable on RDNA4,
            unlike rocm-smi's bogus umc_err_count."""
            text = read(dev + "/ras/event_state") or ""
            out = {}
            for label in ("fatal", "poison_created", "poison_consumed"):
                out[label] = None
            for line in text.splitlines():
                line = line.strip()
                for key, label in (("Fatal Error", "fatal"),
                                   ("Poison Creation", "poison_created"),
                                   ("Poison Consumption", "poison_consumed")):
                    if not line.startswith(key):
                        continue
                    for part in line.split(","):
                        if "count:" in part:
                            try:
                                out[label] = float(part.split("count:")[1].strip())
                            except ValueError:
                                pass
            return out
        def aer_total(dev, kind):
            text = read(dev + "/aer_dev_" + kind) or ""
            for line in text.splitlines():
                fields = line.split()
                if len(fields) == 2 and fields[0].startswith("TOTAL_ERR"):
                    try:
                        return float(fields[1])
                    except ValueError:
                        return None
            return None
        _last = {}
        def zone_power(zone):
            energy = num(SYS + "/class/powercap/" + zone + "/energy_uj")
            now = time.monotonic()
            if energy is None:
                return None
            prev = _last.get(zone)
            _last[zone] = (now, energy)
            if prev is None:
                return None
            delta_t = now - prev[0]
            if delta_t <= 0:
                return None
            watts = (energy - prev[1]) / 1000000.0 / delta_t
            return watts if watts >= 0 else None
        def collect():
            lines = []
            emitted = set()
            def gauge(name, value, help_text, labels=""):
                if value is None:
                    return
                if name not in emitted:
                    emitted.add(name)
                    lines.append("# HELP " + name + " " + help_text)
                    lines.append("# TYPE " + name + " gauge")
                lines.append(name + labels + " " + repr(value))
            for name, dev in cards():
                lbl = '{gpu="' + name + '"}'
                gauge("amd_gpu_busy_percent", num(dev + "/gpu_busy_percent"), "GPU busy percent", lbl)
                gauge("amd_mem_busy_percent", num(dev + "/mem_busy_percent"), "GPU memory (UMC) busy percent", lbl)
                gauge("amd_vram_used_bytes", num(dev + "/mem_info_vram_used"), "VRAM used bytes", lbl)
                gauge("amd_vram_total_bytes", num(dev + "/mem_info_vram_total"), "VRAM total bytes", lbl)
                gtt_used = num(dev + "/mem_info_gtt_used")
                gtt_total = num(dev + "/mem_info_gtt_total")
                gauge("amd_gtt_used_bytes", gtt_used, "GPU GTT used bytes", lbl)
                gauge("amd_gtt_total_bytes", gtt_total, "GPU GTT total bytes", lbl)
                if gtt_used is not None and gtt_total:
                    gauge("amd_gtt_used_percent", gtt_used / gtt_total * 100.0, "GPU GTT used percent", lbl)
                # PCIe link health (TX/RX bandwidth counters are unsupported on RDNA4).
                gauge("amd_pcie_current_link_width", num(dev + "/current_link_width"), "PCIe current link width (lanes)", lbl)
                gauge("amd_pcie_max_link_width", num(dev + "/max_link_width"), "PCIe max link width (lanes)", lbl)
                gauge("amd_pcie_current_link_speed_gt_s", link_speed_gt(dev + "/current_link_speed"), "PCIe current link speed (GT/s)", lbl)
                gauge("amd_pcie_max_link_speed_gt_s", link_speed_gt(dev + "/max_link_speed"), "PCIe max link speed (GT/s)", lbl)
                # Throttle: raw bitmask only. The legacy AMD bit->reason map does
                # NOT hold on RDNA4 (gfx1201): both R9700s read throttle_status=2
                # at 40C/40W (not thermal), so reasons are NOT decoded here.
                # POWER_LIMIT/THERMAL are derived in Grafana from power/cap and
                # junction headroom instead.
                status, indep = gpu_metrics_throttle(dev)
                gauge("amd_gpu_throttle_status", status, "Raw throttle_status bitmask from gpu_metrics (advisory; RDNA4 semantics unresolved)", lbl)
                gauge("amd_gpu_indep_throttle_status", indep, "Raw indep_throttle_status bitmask from gpu_metrics (advisory)", lbl)
                # Fault counters from sysfs AER/RAS (reliable; rocm-smi RAS is not).
                counts = ras_event_counts(dev)
                for key, value in counts.items():
                    gauge("amd_gpu_ras_" + key + "_total", value, "RAS event_state counter", lbl)
                gauge("amd_gpu_aer_correctable_total", aer_total(dev, "correctable"), "PCIe AER correctable error total", lbl)
                gauge("amd_gpu_aer_fatal_total", aer_total(dev, "fatal"), "PCIe AER fatal error total", lbl)
                gauge("amd_gpu_aer_nonfatal_total", aer_total(dev, "nonfatal"), "PCIe AER nonfatal error total", lbl)
                # gpu_vram_bad_pages is a sysfs bin attr whose stat size is always
                # 0; the kernel emits one text line per bad page, so count lines.
                bad_pages_text = read(dev + "/ras/gpu_vram_bad_pages")
                bad_pages = None
                if bad_pages_text is not None:
                    bad_pages = float(sum(1 for line in bad_pages_text.splitlines() if line.strip()))
                gauge("amd_gpu_vram_bad_pages", bad_pages, "VRAM bad pages reported", lbl)
                hw = amdgpu_hwmon(dev)
                if hw:
                    gauge("amd_gpu_temp_edge_celsius", num(hw + "/temp1_input", 1000.0), "GPU edge temperature", lbl)
                    gauge("amd_gpu_temp_junction_celsius", num(hw + "/temp2_input", 1000.0), "GPU junction temperature", lbl)
                    gauge("amd_gpu_temp_mem_celsius", num(hw + "/temp3_input", 1000.0), "GPU memory temperature", lbl)
                    gauge("amd_gpu_temp_junction_crit_celsius", num(hw + "/temp2_crit", 1000.0), "GPU junction temperature crit threshold", lbl)
                    gauge("amd_gpu_sclk_hz", num(hw + "/freq1_input"), "GPU shader clock", lbl)
                    gauge("amd_gpu_mclk_hz", num(hw + "/freq2_input"), "GPU memory clock", lbl)
                    gauge("amd_gpu_fan_rpm", num(hw + "/fan1_input"), "GPU fan speed", lbl)
                    fan_pwm = num(hw + "/pwm1")
                    if fan_pwm is not None:
                        gauge("amd_gpu_fan_percent", fan_pwm / 255.0 * 100.0, "GPU fan speed percent (pwm1)", lbl)
                    gauge("amd_gpu_voltage_mv", num(hw + "/in0_input"), "GPU voltage (mV)", lbl)
                    gauge("amd_gpu_power_watts", num(hw + "/power1_average", 1000000.0), "GPU package power", lbl)
                    gauge("amd_gpu_power_cap_watts", num(hw + "/power1_cap", 1000000.0), "GPU power cap", lbl)
            gauge("amd_cpu_temp_celsius", cpu_temp(), "CPU temperature hottest sensor")
            try:
                zones = sorted(os.listdir(SYS + "/class/powercap"))
            except OSError:
                zones = []
            for zone in zones:
                if ":" not in zone:
                    continue
                watts = zone_power(zone)
                if watts is None:
                    continue
                zone_name = read(SYS + "/class/powercap/" + zone + "/name") or zone
                gauge("amd_cpu_power_watts", watts, "CPU RAPL zone power", '{zone="' + zone_name + '"}')
            return "\n".join(lines) + "\n"
        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                if self.path != "/metrics":
                    self.send_response(404)
                    self.end_headers()
                    return
                data = collect().encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.send_header("Content-Length", str(len(data)))
                self.end_headers()
                self.wfile.write(data)
            def log_message(self, *args):
                pass
        if __name__ == "__main__":
            HTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
        PYEOF
        cat > /out/kvcache-exporter/kvcache-exporter.py <<'PYEOF'
        #!/usr/bin/env python3
        """KV-offload exporter for Prometheus: sizes the RAM (CPU-tier) and DISK (fs-tier) stores.

        RAM: vLLM pre-faults and pins the whole mmap region, so ONLY its allocated size is
        meaningful -- occupancy is not observable (there is no gauge for cached blocks; vLLM's
        kv_offload_cpu_cache_usage_perc is transient in-flight pinning, not fullness).
        DISK: the shared fs-tier dir, which vLLM does not metricise at all.
        Stdlib only, read-only."""
        import os
        import time
        from http.server import BaseHTTPRequestHandler, HTTPServer
        RAM_DIR = "/dev/shm"
        RAM_PREFIX = "vllm_offload_"
        DISK_ROOT = "/kvcache/blocks"
        MAX_BYTES = float(os.environ.get("KVCACHE_MAX_GIB") or 0) * (1024 ** 3)
        PORT = 9102


        def line(name, value, helptext, labels=None):
            labelstr = ""
            if labels:
                labelstr = "{" + ",".join('%s="%s"' % (k, v) for k, v in labels.items()) + "}"
            return "# HELP %s %s\n# TYPE %s gauge\n%s%s %s\n" % (name, helptext, name, name, labelstr, value)


        def scan_ram():
            out = []
            for name in sorted(os.listdir(RAM_DIR)):
                if not (name.startswith(RAM_PREFIX) and name.endswith(".mmap")):
                    continue
                try:
                    st = os.stat(os.path.join(RAM_DIR, name))
                except OSError:
                    continue
                engine = name[len(RAM_PREFIX):-len(".mmap")][:8]
                out.append(line("radiance_kvram_allocated_bytes", st.st_size,
                                "Allocated size of a RAM (CPU) KV tier (pre-faulted and pinned; NOT an occupancy measure).",
                                {"engine": engine}))
            return out


        def scan_disk():
            total = tmp = blocks = 0
            oldest = None
            newest = None
            now = time.time()
            for dirpath, _dirs, files in os.walk(DISK_ROOT):
                for name in files:
                    path = os.path.join(dirpath, name)
                    try:
                        st = os.stat(path)
                    except OSError:
                        continue
                    if name.endswith(".bin"):
                        total += st.st_size
                        blocks += 1
                        age = now - st.st_mtime
                        if oldest is None or age > oldest:
                            oldest = age
                        if newest is None or age < newest:
                            newest = age
                    elif ".tmp" in name:
                        tmp += st.st_size
            out = [
                line("radiance_kvcache_bytes", total, "Bytes held in the shared fs KV tier."),
                line("radiance_kvcache_tmp_bytes", tmp, "Bytes in in-progress fs-tier temp files."),
                line("radiance_kvcache_blocks", blocks, "Blocks in the shared fs KV tier."),
                line("radiance_kvcache_max_bytes", MAX_BYTES, "Reaper cap on the fs KV tier (KVCACHE_MAX_GIB)."),
            ]
            if oldest is not None:
                out.append(line("radiance_kvcache_oldest_block_age_seconds", oldest, "Age of the oldest fs-tier block."))
                out.append(line("radiance_kvcache_newest_block_age_seconds", newest, "Age of the newest fs-tier block."))
            return out


        def collect():
            return "".join(scan_ram() + scan_disk())


        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                if self.path != "/metrics":
                    self.send_response(404)
                    self.end_headers()
                    return
                data = collect().encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.send_header("Content-Length", str(len(data)))
                self.end_headers()
                self.wfile.write(data)

            def log_message(self, *args):
                pass


        if __name__ == "__main__":
            HTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
        PYEOF
        echo "observability configs written"

  # node-exporter: stock collector set + vllm shape-free (each instance scraped by
  # Prometheus directly). CPU/mem/disk/net for the host.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    networks:
      - coolify
    expose:
      - "9100"
    depends_on:
      init-observability:
        condition: service_completed_successfully
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # Shared serve-shape volume: both vllm entrypoints write a textfile metric there
      # (serve_shape_0.prom / serve_shape_1.prom) so the active offload tuning config is
      # visible to Prometheus/Grafana (radiance_serve_info{offload_policy=...}).
      - serve-shape:/textfiles:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.textfile
      - --collector.textfile.directory=/textfiles
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.cpufreq
      - --collector.loadavg
      - --collector.meminfo
      - --collector.vmstat
      - --collector.stat
      - --collector.netdev
      - --collector.netstat
      - --collector.sockstat
      - --collector.filefd
      - --collector.filesystem
      - --collector.diskstats
      - --collector.hwmon
      - --collector.rapl
      - --collector.powersupplyclass
      - --collector.systemd
      - --collector.time
      - --collector.uname
      - --collector.os

  # gpu-exporter: tiny python stdlib exporter for AMD sysfs the generic one lacks.
  # Runs as root because RAPL energy_uj is 0400 root:root.
  gpu-exporter:
    image: python:3.13-alpine
    restart: unless-stopped
    networks:
      - coolify
    expose:
      - "9101"
    depends_on:
      init-observability:
        condition: service_completed_successfully
    volumes:
      - /sys:/host/sys:ro
      - gpu-exporter-code:/code:ro
    command:
      - python3
      - /code/gpu-exporter.py

  # kvcache-exporter: sizes the shared fs (disk) KV tier on the host, which vLLM does
  # not metricise. The RAM tier is covered by the vLLM /metrics kv_offload_cpu_cache_*.
  kvcache-exporter:
    image: python:3.13-alpine
    restart: unless-stopped
    networks:
      - coolify
    expose:
      - "9102"
    depends_on:
      init-observability:
        condition: service_completed_successfully
    environment:
      # Must match the host reaper's KVCACHE_MAX_GIB (/etc/default/kvcache-reap), which
      # ops/install-reaper.sh writes from .env. Default 60 = the installed reaper cap;
      # the >0.90 and >100% alerts divide by this gauge.
      - KVCACHE_MAX_GIB=${KVCACHE_MAX_GIB:-60}
    volumes:
      - ${KV_OFFLOAD_DISK_HOST_DIR:-/var/lib/radiance-kvcache}:/kvcache:ro
      - /dev/shm:/dev/shm:ro
      - kvcache-exporter-code:/code:ro
    command:
      - python3
      - /code/kvcache-exporter.py

  # Prometheus scrapes both vllm instances + node + gpu + model-router + itself.
  prometheus:
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    networks:
      - coolify
    expose:
      - "9090"
    depends_on:
      init-observability:
        condition: service_completed_successfully
    volumes:
      - prometheus-config:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-30d}
      - --web.enable-lifecycle

  # grafana: auto-provisioned datasource + the 2x dashboard above.
  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    networks:
      - coolify
    expose:
      - "3000"
    depends_on:
      init-observability:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
      node-exporter:
        condition: service_started
      gpu-exporter:
        condition: service_started
    # Grafana's admin-username env var must not be spelled as a compose
    # environment key: Coolify then treats it as a compose-managed variable and
    # refuses to let it be deleted from the service environment. So the name is
    # built at container start and mapped from GF_ADMIN_USER (default admin).
    entrypoint:
      - sh
      - -c
      - 'P=GF_SECURITY; export $${P}_ADMIN_USER="$${GF_ADMIN_USER:-admin}"; exec /run.sh'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?set GF_ADMIN_PASSWORD in the Coolify service environment}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - grafana-provisioning:/etc/grafana/provisioning:ro
      - grafana-dashboards:/etc/grafana/dashboards:ro

  # ---------------------------------------------------------------- chat UI
  # Open WebUI points at model-router (:8100), not a single instance, so it rides
  # the same least-in-flight + model-aware routing and transparent fallback.
  # Both instances share the same API key, so this is transparent to the UI.
  # DEFAULT_MODELS empty -> the UI fetches the live model list from the router,
  # which advertises EVERY registry model, so a not-yet-loaded model is
  # selectable (selecting it is what triggers the swap).
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    networks:
      - coolify
    expose:
      - "8080"
    depends_on:
      - model-router
    environment:
      - OPENAI_API_BASE_URL=http://model-router:8100/v1
      - OPENAI_API_KEY=${VLLM_API_KEY:?set VLLM_API_KEY in the Coolify service environment}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in the Coolify service environment}
      - ENABLE_SIGNUP=${WEBUI_SIGNUP:-true}
      - DEFAULT_MODELS=${DEFAULT_MODELS:-}
      - WEBUI_NAME=${WEBUI_NAME:-Radiance MXFP4}
    volumes:
      - open-webui-data:/app/backend/data

networks:
  coolify:
    external: true

volumes:
  prometheus-data:
  prometheus-config:
  grafana-data:
  grafana-provisioning:
  grafana-dashboards:
  gpu-exporter-code:
  kvcache-exporter-code:
  serve-shape:
  serve-shape-1:
  open-webui-data:
